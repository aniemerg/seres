# Minimal structured result schema for this reAM250 BOM research task pack.
format:
  file_type: markdown
  data_location: yaml_frontmatter
  note: "Markdown result files must start with YAML frontmatter containing this structure."

required:
  - function
  - mass
  - material
  - how_to_make
  - assumptions
  - uncertainty_notes
  - kb_implications

sections:
  function:
    required:
      - summary
      - source
    source_required:
      - url_or_path
      - cited_fact_or_basis
      - confidence
  mass:
    required:
      - value_kg
      - basis
      - source
    source_required:
      - url_or_path
      - cited_fact_or_basis
      - confidence
  material:
    required:
      - primary_material
      - source
    source_required:
      - url_or_path
      - cited_fact_or_basis
      - confidence
  how_to_make:
    required:
      - summary
      - manufacturing_steps
      - source
    source_required:
      - url_or_path
      - cited_fact_or_basis
      - confidence

recommended:
  confidence_values:
    - low
    - medium
    - high
    - unknown
