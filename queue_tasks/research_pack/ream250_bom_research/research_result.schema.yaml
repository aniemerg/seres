# Minimal structured result schema for this reAM250 BOM research task pack.
format:
  file_type: markdown
  data_location: yaml_frontmatter
  note: "Markdown result files must start with YAML frontmatter containing this structure."

required:
  - row_identity
  - function
  - mass
  - material
  - how_to_make
  - kb_implications

sections:
  row_identity:
    note: "Must be the first top-level key in the YAML frontmatter. Keep this minimal: Item, CAD file, source_row_number, source_csv, and link_url only when the BOM row has a Link URL."
    required:
      - item
      - cad_file
      - source_row_number
      - source_csv
    optional_when_present_in_bom:
      - link_url
    source_csv_value: "design/real-mechanical/reAm250/reAM250_cad_gold_package/reAm250_BOM_gold.csv"
  function:
    type: object
    required:
      - summary
      - source
      - assumptions
      - uncertainty_notes
    properties:
      source:
        type: object
        required:
          - url_or_path
          - cited_fact_or_basis
          - evidence_basis
  mass:
    note: "mass.value_kg is the per-unit mass for one physical item represented by the BOM row, not quantity multiplied by mass. If the BOM quantity is not 1, mention quantity and optional row total in mass.basis."
    type: object
    required:
      - value_kg
      - basis
      - source
      - assumptions
      - uncertainty_notes
    properties:
      source:
        type: object
        required:
          - url_or_path
          - cited_fact_or_basis
          - evidence_basis
  material:
    type: object
    required:
      - primary_material
      - source
      - assumptions
      - uncertainty_notes
    properties:
      source:
        type: object
        required:
          - url_or_path
          - cited_fact_or_basis
          - evidence_basis
  how_to_make:
    type: object
    required:
      - summary
      - manufacturing_steps
      - source
      - assumptions
      - uncertainty_notes
    properties:
      source:
        type: object
        required:
          - url_or_path
          - cited_fact_or_basis
          - evidence_basis
  kb_implications:
    note: "Top-level list for later KB modeling hints. Must include exactly one machine-searchable item granularity signal."
    type: list
    required_item:
      prefix: "item_granularity: <value> - "
      allowed_values:
        - simple_part
        - assembly
        - purchased_module
        - consumable
        - raw_material_or_stock
        - unknown

semantics:
  note: "This schema is the structural contract. Detailed writing and evidence-decision rules live in acceptance_criteria.md."
  cited_fact_or_basis: "Source facts only: what the cited URL/file/CAD measurement/local extractor/standard table directly says or measures."
  assumptions: "Modeling premises adopted to transform source facts into the section value; use [] when none are needed."
  uncertainty_notes: "Residual limitations or risks that affect downstream trust, specification, or use of the section value; not an audit log; use [] when none remain."
  evidence_basis: "Evidence class label for the section source; use one of evidence_basis_values. Decision rules live in acceptance_criteria.md."
  evidence_basis_values:
    - bom_provided
    - independent_vendor_spec
    - standard_part_convention
    - engineering_hypothesis
    - unresolved
