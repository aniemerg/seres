# Minimal structured result schema for this reAM250 BOM research task pack.
format:
  file_type: markdown
  data_location: yaml_frontmatter
  note: "Markdown result files must start with YAML frontmatter containing this structure."

required:
  - function
  - mass
  - material
  - how_to_make
  - kb_implications

sections:
  function:
    required:
      - summary
      - source
      - assumptions
      - uncertainty_notes
    source_required:
      - url_or_path
      - cited_fact_or_basis
      - evidence_basis
  mass:
    required:
      - value_kg
      - basis
      - source
      - assumptions
      - uncertainty_notes
    source_required:
      - url_or_path
      - cited_fact_or_basis
      - evidence_basis
  material:
    required:
      - primary_material
      - source
      - assumptions
      - uncertainty_notes
    source_required:
      - url_or_path
      - cited_fact_or_basis
      - evidence_basis
  how_to_make:
    required:
      - summary
      - manufacturing_steps
      - source
      - assumptions
      - uncertainty_notes
    source_required:
      - url_or_path
      - cited_fact_or_basis
      - evidence_basis

recommended:
  evidence_basis_note: "Source type, not a global truth ranking. See README.md and agent.md for decision order."
  evidence_basis_values:
    - bom_row
    - vendor_spec
    - cad_or_local_metadata
    - standard_part_convention
    - engineering_hypothesis
    - unresolved
