body{font-family:system-ui,Segoe UI,sans-serif;margin:0;background:#f6f7f9;color:#202124}

h1{font-size:16px;margin:0 0 8px}
.controls{display:grid;grid-template-columns:minmax(150px,220px) 118px minmax(150px,210px) minmax(160px,210px) minmax(210px,260px) minmax(340px,520px);gap:8px;align-items:start}

.evidence-block{border:1px solid #ccd3df;background:#f8fafc;border-radius:4px;padding:7px 8px}
.evidence-title{font-size:11px;font-weight:600;color:#445;margin-bottom:5px}
.evidence-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.evidence-grid label{display:grid;grid-template-columns:64px minmax(120px,1fr);gap:5px;align-items:center;font-size:11px;color:#555}
.evidence-grid select{width:100%;height:28px}
.summary{font-size:12px;color:#444;margin-top:8px;line-height:1.45}
main{padding:12px}
.wrap{overflow:auto;max-height:calc(100vh - 122px);background:white;border:1px solid #ccd3df}
table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:12px}
th,td{border-right:1px solid #e0e4eb;border-bottom:1px solid #e0e4eb;padding:6px 8px;max-width:380px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
th{position:sticky;top:0;z-index:2;background:#eef2f7;text-align:left;cursor:pointer}
th:first-child,td:first-child{position:sticky;left:0;background:white;z-index:1}
th:first-child{z-index:4;background:#e7edf5}
tr:hover td{background:#f8fbff}
.good{background:#e8f5ec}
.bad{background:#fdebec}
.mid{background:#edf3ff}
.none{color:#666}
.hyp{background:#fff6d9}
@media(max-width:980px){.controls{grid-template-columns:1fr 1fr}.evidence-block{grid-column:1/-1}}

let sort='source_row_number', asc=true;
const statusOrder=["Useful link", "Unusable link", "Found link", "No link"];
const materialOrder=["Specific material", "Unknown/unspecified material"];
const stepOrder=["matched_existing", "assembly_only", "ambiguous", "missing_in_cad"];
function str(v){return String(v ?? '');}
function esc(v){return str(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');}
function uniq(c){return [...new Set(rows.map(r=>str(r[c])).filter(Boolean))].sort();}
function fill(id,c,order){
  const el=document.getElementById(id);
  const vals=order || uniq(c);
  vals.forEach(v=>{ if(rows.some(r=>str(r[c])===v)) el.add(new Option(v,v)); });
}
fill('website','website_status',statusOrder);
fill('stepStatus','step_export_status',stepOrder);
fill('materialSpecificity','material_specificity',materialOrder);
fill('funcEv','function_evidence_basis');
fill('massEv','mass_evidence_basis');
fill('matEv','material_evidence_basis');
fill('makeEv','how_to_make_evidence_basis');
function data(){
  const q=document.getElementById('q').value.toLowerCase();
  const wf=document.getElementById('website').value;
  const ssf=document.getElementById('stepStatus').value;
  const msf=document.getElementById('materialSpecificity').value;
  const ff=document.getElementById('funcEv').value;
  const mf=document.getElementById('massEv').value;
  const matf=document.getElementById('matEv').value;
  const makef=document.getElementById('makeEv').value;
  return rows.filter(r=>(!q||cols.some(c=>str(r[c]).toLowerCase().includes(q)))&&(!wf||str(r.website_status)===wf)&&(!ssf||str(r.step_export_status)===ssf)&&(!msf||str(r.material_specificity)===msf)&&(!ff||str(r.function_evidence_basis)===ff)&&(!mf||str(r.mass_evidence_basis)===mf)&&(!matf||str(r.material_evidence_basis)===matf)&&(!makef||str(r.how_to_make_evidence_basis)===makef)).sort((a,b)=>{
    let av=a[sort], bv=b[sort], an=Number(av), bn=Number(bv);
    let cmp=!Number.isNaN(an)&&!Number.isNaN(bn)?an-bn:str(av).localeCompare(str(bv));
    return asc?cmp:-cmp;
  });
}
function cls(c,v){
  v=str(v);
  if(v.includes('engineering_hypothesis'))return'hyp';
  if(c==='website_status'&&v==='Useful link')return'good';
  if(c==='website_status'&&v==='Unusable link')return'bad';
  if(c==='website_status'&&v==='Found link')return'mid';
  if(c==='website_status'&&v==='No link')return'none';
  if(c==='material_specificity'&&v==='Unknown/unspecified material')return'hyp';
  if(c==='step_export_status'&&v==='matched_existing')return'good';
  if(c==='step_export_status'&&v==='missing_in_cad')return'bad';
  if(c==='step_export_status'&&['assembly_only','ambiguous'].includes(v))return'mid';
  return'';
}
function render(){
  const rs=data();
  const stepText=Object.entries(baseSummary.step_export_status).map(([k,v])=>`${k}=${v}`).join(', ');
  document.getElementById('sum').textContent = `Showing ${rs.length} / ${rows.length} rows. Website: Useful link=${baseSummary.website_status['Useful link']}, Unusable link=${baseSummary.website_status['Unusable link']}, Found link=${baseSummary.website_status['Found link']}, No link=${baseSummary.website_status['No link']}. STEP status: ${stepText}. Material: Specific=${baseSummary.material_specificity['Specific material']}, Unknown/unspecified=${baseSummary.material_specificity['Unknown/unspecified material']}. Unresolved evidence=${baseSummary.unresolved_evidence_count}.`;
  const t=document.getElementById('t');
  t.innerHTML='<thead><tr>'+cols.map(c=>`<th data-c="${c}">${c}${sort===c?(asc?' ▲':' ▼'):''}</th>`).join('')+'</tr></thead><tbody>'+rs.map(r=>'<tr>'+cols.map(c=>`<td class="${cls(c,r[c])}" title="${esc(r[c])}">${esc(r[c])}</td>`).join('')+'</tr>').join('')+'</tbody>';
  t.querySelectorAll('th').forEach(th=>th.onclick=()=>{const c=th.dataset.c;if(sort===c)asc=!asc;else{sort=c;asc=true}render();});
}
function clearFilters(){
  ['q','website','stepStatus','materialSpecificity','funcEv','massEv','matEv','makeEv'].forEach(id=>{document.getElementById(id).value='';});
  render();
}
document.querySelectorAll('input,select').forEach(el=>el.addEventListener('input',render));
document.getElementById('resetFilters').addEventListener('click',clearFilters);
render();
</script></body></html>
