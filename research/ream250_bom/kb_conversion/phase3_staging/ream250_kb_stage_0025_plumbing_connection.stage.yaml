stage_findings:
  - Existing broad fitting kits are too coarse for these rows because nominal interface and leak tightness are closure-relevant.
  - Vacuum hardware is not automatically an import when machining, welding, cleaning, inspection, and leak-test anchors exist.
  - Standard-interface details such as DN63_ISO-K, DN50_ISO-KF, and DN100_ISO-K should remain in mappings and closure identity rather than functional-purpose keys.
  - The custom gas-outlet plate remains a local manufacture candidate, but material uncertainty blocks direct promotion.
  - Future promotion may need a structured standard_interface field instead of carrying interface data only in notes and guardrails.

unresolved:
  - Whether a broader ISO vacuum fittings kit can replace individual standard-interface items without losing closure fidelity.
  - Whether helium leak testing is required for each item or only for assembled plumbing systems.
  - Whether early bootstrap should import certified vacuum fittings despite local manufacturability in principle.
  - Exact alloy, surface finish, cleaning, passivation, weld procedure, and leak-rate acceptance values for promotion.
  - Whether the gas-outlet flange plate's radial web geometry is function-critical or can be simplified for lunarized local manufacture.
