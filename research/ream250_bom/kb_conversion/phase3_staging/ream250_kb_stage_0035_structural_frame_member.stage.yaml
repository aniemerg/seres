stage_findings:
  - Phase 2 partial merge remains appropriate: profile rows 298, 213, and 300 share one stock-family closure item, while side-plate rows 29 and 30 share one handed machined-plate family.
  - Existing KB structural-frame entries are broad frame assemblies or steel placeholders and should not replace the 60 x 60 aluminum profile stock item.
  - Existing KB plate and fixture entries are too broad, too heavy, steel-specific, or kit-like to replace the reAM250 Z-axis side plates without losing alignment evidence.
  - Both staged items are local-manufacture candidates rather than imports, but the profile is blocked by a recipe gap and the side plate is blocked by precision and material guardrails.
  - BOM mappings must carry row-specific cut length, quantity, handedness, mass, and alignment or connector guardrails because the staged item identities intentionally merge variants.

unresolved:
  - Need decide whether the aluminum structural profile should promote as meter-based stock, a nominal cut-length part, or both stock and cut-length derived items.
  - Need structural-profile recipe bindings for aluminum feedstock, extrusion die assumptions, finishing, cut-to-length operations, deburring, scrap, and inspection.
  - Exact profile alloy, temper, anodized finish, slot tolerance, straightness, and connector compatibility remain unresolved.
  - Need final material decision for the Z-axis side plates, especially row 30 where aluminum and steel scenarios remain plausible.
  - Need decide whether the Z-axis side plates promote as one handed-variant family or separate left and right item IDs.
  - Need recipe and inspection details for side-plate stock input, machining allowance, scrap, drilling or tapping, finish, datum scheme, flatness, hole location, and guide or bearing alignment.
