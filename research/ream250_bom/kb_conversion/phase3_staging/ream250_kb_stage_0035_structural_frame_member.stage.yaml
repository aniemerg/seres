proposed_items:
  - action: create_new
    proposed_item_id: aluminum_structural_profile_60x60_v0
    phase2_item_id: ream250_aluminum_structural_profile_60x60_v0
    reason_for_action: No close reusable KB item preserves the 60 x 60 aluminum slotted structural profile family, extrusion-stock identity, cut-length variants, connector-slot guardrails, and roughly 3.9 kg/m mass basis.
    kb_like_item:
      id: aluminum_structural_profile_60x60_v0
      name: Aluminum structural profile 60 x 60
      kind: part
      unit: m
      unit_kind: bulk
      material_class: aluminum
      mass_kg_per_m: 3.9
      notes: Staged reusable 60 x 60 slotted aluminum structural profile stock for machine frames. reAM250 rows 298, 213, and 300 map here as cut lengths of 740 mm, 960 mm, and 1020 mm; source BOM quantities and row masses stay in BOM mappings. Exact alloy, temper, anodized finish, slot tolerance, and connector compatibility remain promotion guardrails.
      source_tags:
        - ream250_bom_phase3_stage
    closure_identity:
      functional_purpose: modular machine-frame structural support member
      material: aluminum_alloy_profile_family
      scale_or_capacity:
        mass_kg_per_m: 3.9
        profile_size_mm: 60 x 60
        cut_length_variants_mm:
          - 740
          - 960
          - 1020
        per_unit_mass_range_kg:
          - 2.889
          - 3.982
        bom_quantity_range:
          - 1
          - 2
        row_total_mass_range_kg:
          - 3.747
          - 7.963
        scale_class: medium
      geometry_form: slotted_square_structural_profile_60x60_cut_length_variants
    process_assumptions:
      primary_process_bucket: structural_profile_stock_fabrication_cutting
      local_path_summary: Extrude aluminum alloy through a 60 x 60 slotted-profile die, straighten and age as needed, cut to row-specific lengths, deburr, finish or anodize, and inspect length, straightness, end squareness, slot geometry, and connector fit.
      candidate_existing_processes:
        - process_id: metal_extrusion_process_v0
          fit: partial
          reason: Existing aluminum extrusion anchor, but currently heat-sink-fin oriented rather than a structural framing profile.
        - process_id: extrusion_basic_v0
          fit: poor_fit
          reason: Generic extrusion template exists but needs metal-profile binding and structural slot geometry before promotion.
        - process_id: aluminum_tube_stock_extrusion_v0
          fit: supporting
          reason: Aluminum stock extrusion precedent, though tube stock is not the same 60 x 60 slotted profile.
        - process_id: metal_cutting_basic_v0
          fit: direct
          reason: Covers cutting extrusion stock to the 740 mm, 960 mm, and 1020 mm source lengths.
        - process_id: surface_treatment_anodizing_v0
          fit: supporting
          reason: Relevant if Bosch-style anodized aluminum finish is preserved.
        - process_id: inspection_basic_v0
          fit: supporting
          reason: Covers length, straightness, end squareness, slot integrity, and connector-fit checks.
    import_local_decision:
      decision: local_manufacture_candidate_with_recipe_gap
      is_import: false
      rationale: This is structural aluminum stock with plausible local extrusion, cutting, finishing, and inspection anchors. It is not advanced optics, electronics, a precision reducer, a high-grade sensor, or a specialty material, but promotion needs a structural-profile-specific recipe and stock unit decision.
      local_path_summary: Produce aluminum profile stock by extrusion, finish it, cut to BOM lengths, deburr, and inspect profile geometry.
      existing_kb_pattern_used:
        - "kb/processes/metal_extrusion_process_v0.yaml: local aluminum extrusion anchor, though output binding is heat-sink-oriented."
        - "kb/processes/metal_cutting_basic_v0.yaml: local cut-to-length anchor."
        - "kb/items/parts/structural_frame_medium.yaml: existing frame abstractions are local-modeled but too broad and steel-specific to reuse."
      import_risk_factors:
        - Requires a matched 60 x 60 slotted extrusion die and profile process control.
        - Exact alloy, temper, anodized finish, slot tolerance, straightness, and connector compatibility remain unresolved.
      local_manufacture_blockers:
        - Need a recipe binding aluminum feedstock to structural profile stock rather than heat-sink or tube outputs.
        - Need decide whether promoted KB item uses meter-based bulk stock or discrete nominal cut-length parts.
        - Need finish and inspection acceptance assumptions before promotion.
    promotion_blockers:
      - Decide whether the promoted ID stays general as aluminum_structural_profile_60x60_v0 or becomes reAM250-specific.
      - Current checked KB patterns mix bulk and discrete part semantics; promotion needs a clear stock-unit model for length variants.
      - Need recipe-level extrusion, cutting, deburring, finishing, scrap, and inspection assumptions.
      - Exact Bosch Rexroth material number, alloy, temper, finish, slot tolerance, and connector compatibility remain unresolved.

  - action: create_new
    proposed_item_id: ream250_z_axis_side_plate_machined_v0
    phase2_item_id: ream250_z_axis_side_plate_machined_v0
    reason_for_action: No reusable KB item preserves the mirrored ribbed 240 x 400 x 23 mm side-plate geometry, handed Z-axis role, guide and bearing interface alignment guardrails, and row-level mass evidence.
    kb_like_item:
      id: ream250_z_axis_side_plate_machined_v0
      name: reAM250 Z-axis machined side plate
      kind: part
      unit: unit
      unit_kind: discrete
      material_class: metal
      mass_kg: 3.5
      notes: Staged one-piece handed Z-axis side plate family from reAM250 rows 29 and 30. Mass is the aluminum-planning scenario, about 3.49 to 3.50 kg per plate; steel construction would be roughly 10 kg per plate. Left and right handedness, row-specific material uncertainty, and alignment guardrails are preserved in BOM mappings.
      source_tags:
        - ream250_bom_phase3_stage
    closure_identity:
      functional_purpose: handed structural side support for Z-axis guide and bearing assembly interfaces
      material: structural_metal_alloy_planning_aluminum
      scale_or_capacity:
        per_unit_mass_range_kg:
          - 3.49
          - 3.5
        bom_quantity_range:
          - 1
          - 1
        row_total_mass_range_kg:
          - 3.49
          - 3.5
        envelope_mm: 240 x 400 x 23
        scale_class: medium
      geometry_form: mirrored_triangular_ribbed_machined_side_plate_with_mounting_hole_edge
    process_assumptions:
      primary_process_bucket: general_subtractive_machining
      local_path_summary: Rough cut thick structural metal stock, CNC machine the triangular profile, ribbed reliefs, datum and mating faces, drill or tap mounting holes, deburr, finish, and inspect flatness, hole location, guide interface alignment, and bearing interface alignment.
      candidate_existing_processes:
        - process_id: machining_basic_v0
          fit: partial
          reason: Covers general stock removal from plate or billet stock but not all datum and Z-axis alignment requirements.
        - process_id: machining_precision_v0
          fit: supporting
          reason: Relevant for guide, support, bearing, datum-face, and hole-location guardrails.
        - process_id: drilling_basic_v0
          fit: supporting
          reason: Covers mounting-hole pattern creation before precision finishing and inspection.
        - process_id: surface_finishing_basic_v0
          fit: supporting
          reason: Relevant if anodizing, passivation, blackening, or protective finishing is selected later.
        - process_id: inspection_basic_v0
          fit: supporting
          reason: Covers flatness, hole positions, datum faces, envelope dimensions, and fit into the Z-axis stack.
    import_local_decision:
      decision: local_manufacture_candidate_with_precision_guardrails
      is_import: false
      rationale: The rows describe monolithic machined structural plates, not optics, electronics, reducers, sensors, or specialty material modules. Existing basic and precision machining anchors make them local candidates, but promotion must retain unresolved material and Z-axis alignment guardrails.
      local_path_summary: Machine a handed plate from structural metal stock, drill and finish mounting features, then inspect alignment-critical faces and holes.
      existing_kb_pattern_used:
        - "kb/processes/machining_basic_v0.yaml: local machining anchor for plate and billet stock removal."
        - "kb/processes/machining_precision_v0.yaml: local precision-machining anchor for alignment-critical features."
        - "kb/items/parts/fixture_mounting_plate_set.yaml: existing plate-like item is local-modeled but too heavy, steel-specific, and kit-like to reuse."
      import_risk_factors:
        - Row 30 material is unresolved; aluminum and steel scenarios change mass and machining requirements.
        - Z-axis guide and bearing interfaces may need tighter datum, flatness, and hole-location control than ordinary structural plates.
      local_manufacture_blockers:
        - Need accepted planning material or final material evidence before promotion.
        - Need recipe-level stock input, scrap allowance, rough cutting, precision machining, drilling, finishing, and inspection path.
        - Need decide whether handed variants remain one item with BOM mapping notes or become left and right item IDs.
    promotion_blockers:
      - Exact alloy, heat treatment, coating, thread details, datum scheme, flatness, hole-location tolerance, and guide or bearing interface tolerances remain unresolved.
      - Need decide if one staged family should cover both handed plates or if promotion should split left and right variants.
      - Need recipe binding for stock, scrap, machining, drilling, finishing, and dimensional inspection.
      - Need decide whether alignment guardrails belong in item notes, BOM notes, recipe inspection steps, or all three.

