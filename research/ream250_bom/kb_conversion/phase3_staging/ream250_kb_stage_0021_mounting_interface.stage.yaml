stage_findings:
  - Phase 2 split is appropriate because the camera mounting plate and scanner adapter flange differ in function, geometry, process bucket, and precision guardrails.
  - Existing KB mount and fixture entries are too generic, too heavy, kit-like, bulk-modeled, or steel-specific to reuse without losing row evidence.
  - Both proposed items should remain local-manufacture candidates because they are structural machined metal parts with existing process anchors.
  - The camera mounting plate mainly needs recipe and material decisions; the scanner adapter flange additionally needs explicit precision and cleanliness guardrails.
  - Row-specific BOM mappings are necessary because the two staged items share only a broad mounting-interface search key.

unresolved:
  - Exact material and alloy grade remain unknown for both rows; current masses are aluminum-scenario estimates.
  - Need decide whether future promoted IDs should retain the reAM250 prefix or become more generic closure items.
  - Need determine recipe stock inputs, scrap, finishing, and inspection requirements for both staged items.
  - Need scanner flange interface details: bolt specification, sealing role, cleanliness requirement, flatness, concentricity, and optical alignment tolerance.
  - Need camera plate interface details: mating faces, fastener features, coating, flatness, and alignment tolerance.
