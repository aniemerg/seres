purpose: Stage Phase 2 split mounting-interface candidates for later KB promotion without editing kb/.

evidence_inputs:
  merge_review_read: true
  original_rows_read:
    - research/ream250_bom/ream250_bom_row_0370_1764.md
    - research/ream250_bom/ream250_bom_row_0309_179.md
  existing_kb_checked:
    items:
      - kb/items/parts/instrument_mounts_basic.yaml
      - kb/items/parts/precision_mounts_and_fixtures.yaml
      - kb/items/parts/fixture_mounting_plate_set.yaml
      - kb/items/parts/modular_machine_interface_v0.yaml
      - kb/items/parts/mounting_bracket_steel.yaml
      - kb/items/parts/mounting_bracket_steel_v0.yaml
      - kb/items/parts/metal_sheet_or_plate.yaml
      - kb/items/parts/rover_payload_hardpoint_set_v0.yaml
    processes:
      - kb/processes/cutting_basic_v0.yaml
      - kb/processes/metal_cutting_basic_v0.yaml
      - kb/processes/machining_basic_v0.yaml
      - kb/processes/machining_precision_v0.yaml
      - kb/processes/drilling_basic_v0.yaml
