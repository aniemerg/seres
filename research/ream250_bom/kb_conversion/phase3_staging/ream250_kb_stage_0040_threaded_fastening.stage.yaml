stage_findings:
  - "Phase 3 can directly reuse an existing KB item for this merge group; no new reAM250-specific screw item is warranted under the 5x reuse policy."
  - "The existing fastener_kit_small BOM already calls out M3-M5 socket head cap screws, making it a closer fit than generic fastener bulk items or the medium kit."
  - "BOM mappings must carry exact M4x0.7 thread, DIN 912 form, length variants, quantities, and row masses because the kit item intentionally abstracts over many hardware sizes."
  - "The import/local decision is local through the existing recipe and process, with unresolved specialty fastener attributes recorded as import risks rather than immediate blockers."
  - "Existing KB schema drift remains visible because fastener_kit_small uses `mass` while the current schema reference calls for `mass_kg` on discrete parts."

unresolved:
  - "Whether promoted reAM250 BOMs should consume fastener_kit_small by kit unit, by row-specific screw count, or by mass allocation from a kit."
  - "Whether exact M4 DIN 912 socket-head screws should ever become nested kit members if later simulation needs per-size inventory."
  - "Property class, coating, exact mild-steel grade, heat treatment, thread tolerance, socket tolerance, and installed joint duty are not specified by the source rows."
  - "Whether to open a separate schema cleanup task for fastener_kit_small mass versus mass_kg."
