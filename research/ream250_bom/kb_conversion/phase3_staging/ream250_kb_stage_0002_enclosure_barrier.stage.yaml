    closure_item_id: ream250_chamber_imaging_cover_plate_v0
    quantity: 1
    unit: unit
    row_total_mass_kg: 0.114
    envelope_mm: 99 x 69 x 7
    geometry_form: shallow_rectangular_machined_cover_with_corner_holes
    preserved_guardrails:
      - sealing_surface_flatness
      - corner_hole_pattern_alignment
      - chamber_cleanliness_finish
      - material_substitution_review
      - optional_leak_test_if_pressure_boundary
    notes: Preserve the row as a distinct chamber imaging-interface cover plate after Phase 2 split; adjacent seal evidence is a guardrail, not proof that this is a full sealed chamber component.

stage_findings:
  - Phase 2 split is appropriate because the scanner laser-barrier cover and chamber imaging-interface cover differ in function, material uncertainty, geometry, and failure modes.
  - Existing KB cover, enclosure, panel, and guard items are too generic, too massive, bulk-modeled, transparent, electronics-oriented, dust-guard oriented, or assembly-level to reuse without losing row evidence.
  - Both proposed items should remain local-manufacture candidates because their base geometry is simple sheet or plate work with existing KB process anchors.
  - The scanner cover carries certification and optical-opacity risk that may force imported rated stock or imported verification even if cutting is local.
  - The chamber cover carries metal alloy, finish, cleanliness, flatness, hole-alignment, and possible leak-test guardrails before promotion.
  - Row-specific BOM mappings are necessary because the two items share only a broad enclosure-barrier discovery key.

unresolved:
  - Row 346 actual material family, optical density, wavelength rating, certification basis, mounting details, and edge finish remain unknown.
  - Row 8 exact alloy, coating, finish, seal compression role, flatness, leak-rate requirement, and chamber cleanliness requirement remain unknown.
  - Need decide whether the staged scanner barrier material_class should stay composite, switch to metal, or become an import material dependency after material evidence improves.
  - Need decide whether future promoted IDs should retain the reAM250 prefix or merge into broader generic cover-plate families.
  - Need recipe-level stock inputs, scrap allowances, cutting, drilling, machining, finishing, cleaning, inspection, and verification requirements for both staged items.
