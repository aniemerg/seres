stage_findings:
  - Phase 2 proposed items are usable, but Phase 3 needs an explicit `action` field because some outputs create new items while others reuse existing KB items.
  - Stock-like profile items challenge the current part schema because length varies by BOM row; a staging schema must preserve length separately from item identity.
  - Phase 3 needs a BOM mapping table, otherwise row quantities and length variants are lost during merge.
  - Process bucket alone is insufficient for promotion; recipe bindings and output item choices remain separate work.
  - Import/local manufacture must be a Phase 3 decision, because row conversion explicitly defers it and merge review only records implications.

unresolved:
  - Should `aluminum_structural_profile_60x60_v0` use unit `m` as stock or unit `unit` as a nominal cut-length part?
  - Should the Z-axis side plate item keep aluminum material_class despite row 30 uncertainty?
  - Should Phase 3 generate follow-up queue tasks for recipe creation and material resolution?
