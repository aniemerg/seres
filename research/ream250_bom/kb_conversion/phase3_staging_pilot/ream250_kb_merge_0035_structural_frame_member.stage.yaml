stage_id: phase3_pilot_ream250_kb_merge_0035_structural_frame_member
stage_status: pilot_only
source_merge_review: research/ream250_bom/kb_conversion/merge_reviews/ream250_kb_merge_0035_structural_frame_member.md
source_phase2_decision: partial_merge
purpose: Test whether a Phase 2 partial merge can become concrete KB staging without writing to kb/.

evidence_inputs:
  merge_review_read: true
  original_rows_read:
    - research/ream250_bom/ream250_bom_row_0298_95.md
    - research/ream250_bom/ream250_bom_row_0213_9B.md
    - research/ream250_bom/ream250_bom_row_0300_97.md
    - research/ream250_bom/ream250_bom_row_0029_2A6.md
    - research/ream250_bom/ream250_bom_row_0030_2A7.md
  existing_kb_checked:
    items:
      - kb/items/parts/table_top_t_slot.yaml
      - kb/items/parts/fixture_mounting_plate_set.yaml
      - kb/items/parts/mounting_bracket_steel.yaml
    processes:
      - kb/processes/metal_extrusion_process_v0.yaml
      - kb/processes/metal_cutting_basic_v0.yaml
      - kb/processes/machining_basic_v0.yaml
      - kb/processes/machining_precision_v0.yaml
  notes: Existing KB has related fixturing and machining concepts but no direct 60 x 60 aluminum structural profile item.

proposed_items:
  - action: create_new
    proposed_item_id: aluminum_structural_profile_60x60_v0
    phase2_item_id: ream250_aluminum_structural_profile_60x60_v0
    reason_for_action: No direct reusable KB item for 60 x 60 aluminum slotted structural profile stock was found.
    kb_like_item:
      id: aluminum_structural_profile_60x60_v0
      name: Aluminum structural profile 60 x 60
      kind: part
      unit: m
      unit_kind: bulk
      material_class: aluminum
      mass_kg_per_m: 3.9
      notes: Pilot staging item for cut-to-length 60 x 60 slotted aluminum structural profile. Based on reAM250 rows 298, 213, and 300; length variants remain BOM mapping details.
      source_tags:
        - ream250_bom_phase3_pilot
    closure_identity:
      functional_purpose: modular machine-frame structural support member
      material: aluminum_alloy_profile_family
      scale_or_capacity:
        profile_size_mm: 60 x 60
        cut_length_variants_mm:
          - 740
          - 960
          - 1020
        per_unit_mass_range_kg:
          - 2.889
          - 3.982
      geometry_form: slotted_square_structural_profile_60x60_cut_length_variants
    process_assumptions:
      primary_process_bucket: structural_profile_stock_fabrication_cutting
      candidate_existing_processes:
        - process_id: metal_extrusion_process_v0
          fit: partial
          reason: Existing metal extrusion process is aluminum but currently heat-sink-oriented.
        - process_id: metal_cutting_basic_v0
          fit: direct
          reason: Covers cutting extrusion stock to row-specific length.
        - process_id: surface_treatment_anodizing_v0
          fit: supporting
          reason: Relevant if anodized profile finish is retained.
        - process_id: inspection_basic_v0
          fit: supporting
          reason: Covers cut length, straightness, slot geometry, and end squareness checks.
    import_local_decision:
      decision: local_manufacture_candidate_with_recipe_gap
      is_import: false
      rationale: "Structural aluminum profile is not in the same class as precision optics, electronics, harmonic drives, or high-strength specialty hardware. Existing KB has aluminum extrusion process anchors, but no structural-profile-specific recipe yet."
      local_path_summary: "Produce aluminum profile stock through extrusion, cut to BOM lengths, deburr, finish, and inspect profile geometry."
      existing_kb_pattern_used:
        - "docs/project_overview.md: items that cannot be manufactured locally become imports, but this profile has plausible local process anchors."
        - "docs/knowledge_acquisition_protocol.md: import when modeling effort is high relative to impact or outside current scope; this is a major structural mass item, so prefer local candidate."
        - "kb/items/parts/drive_motor_medium.yaml: complex item can remain local when most mass is manufacturable and imported subcomponents are explicit."
      import_risk_factors:
        - "Requires extrusion die and profile tolerance control."
        - "Exact alloy, temper, anodized finish, and connector slot compatibility are unresolved."
      local_manufacture_blockers:
        - "Need structural-profile recipe binding aluminum feedstock to profile output."
        - "Need decide stock unit model before recipe promotion."
    promotion_blockers:
      - Decide whether this should be a general KB item or retain a reAM250 prefix.
      - Current KB item schema expects `mass_kg` for discrete parts; meter-based stock may require either bulk unit handling or a discrete nominal-length item.
      - Existing `metal_extrusion_process_v0` outputs heat_sink_fin_extrusion, so a structural-profile recipe would need recipe-level bindings or a new process variant.
      - Exact alloy, temper, anodized finish, profile tolerances, and connector compatibility remain unresolved.

  - action: create_new
    proposed_item_id: z_axis_side_plate_machined_pair_v0
    phase2_item_id: ream250_z_axis_side_plate_machined_v0
    reason_for_action: Rows 29 and 30 are a handed machined side-plate pair with no direct reusable KB equivalent.
    kb_like_item:
      id: z_axis_side_plate_machined_pair_v0
      name: Z-axis machined side plate pair
      kind: part
      unit: unit
      unit_kind: discrete
      mass_kg: 3.5
      material_class: aluminum
      notes: Pilot staging item representing one handed machined Z-axis side plate. Left/right handedness is preserved in BOM row mappings, not separate item IDs for this pilot.
      source_tags:
        - ream250_bom_phase3_pilot
    closure_identity:
      functional_purpose: handed structural side support for Z-axis guide and bearing assembly interfaces
      material: structural_metal_alloy_planning_aluminum
      scale_or_capacity:
        per_unit_mass_range_kg:
          - 3.49
          - 3.5
        envelope_mm: 240 x 400 x 23
        scale_class: medium
      geometry_form: mirrored_triangular_ribbed_machined_side_plate_with_mounting_hole_edge
    process_assumptions:
      primary_process_bucket: general_subtractive_machining
      candidate_existing_processes:
        - process_id: machining_basic_v0
          fit: partial
          reason: Covers coarse stock removal but not all ribbed pockets and datum guardrails.
        - process_id: machining_precision_v0
          fit: supporting
          reason: Relevant for guide and bearing alignment surfaces.
        - process_id: drilling_basic_v0
          fit: supporting
          reason: Covers mounting-hole pattern creation before final precision checks.
        - process_id: inspection_basic_v0
          fit: supporting
          reason: Covers dimensional checks of flatness, hole position, and datum faces.
    import_local_decision:
      decision: local_manufacture_candidate_with_precision_guardrails
      is_import: false
      rationale: "A machined structural side plate is within the KB's general local manufacturing scope if CNC machining and inspection are available. It lacks the specialty reasons seen in existing import examples such as optical flats, electronics, or harmonic drives."
      local_path_summary: "Machine from aluminum or structural metal plate stock using rough cutting, CNC milling, drilling, deburring, finishing, and dimensional inspection."
      existing_kb_pattern_used:
        - "kb/processes/machining_basic_v0: generic local machining anchor."
        - "kb/processes/machining_precision_v0: local precision-machining anchor for alignment-critical features."
        - "kb/imports/harmonic_drive_reducer_medium.yaml: precision gear reducers are imported because of tooth accuracy and specialized metrology; this side plate is less specialized but still carries alignment guardrails."
      import_risk_factors:
        - "Material unresolved; steel scenario would change mass and machining assumptions."
        - "Z-axis guide and bearing interfaces may require tighter inspection than ordinary plates."
      local_manufacture_blockers:
        - "Need material resolution or accepted planning material."
        - "Need recipe-level stock, scrap, precision inspection, and surface finish assumptions."
    promotion_blockers:
      - Row 30 material is unresolved; aluminum is a planning assumption and steel would change mass by about 3x.
      - Need decide whether handed left/right plates should be variants of one item or separate item IDs.
      - Need decide where alignment guardrails belong: item notes, BOM notes, or recipe inspection requirements.
      - Recipe cannot be promoted without binding stock input, scrap allowance, and precision inspection path.

