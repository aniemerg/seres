stage_findings:
  - "Existing broad fitting kits are too coarse for Phase 3 when nominal interface and leak-tightness are closure-relevant."
  - "Phase 3 needs to distinguish local-manufacture candidate from import; vacuum hardware is not automatically import if machining and leak-test anchors exist."
  - "Standard-interface fields such as DN63_ISO-K and DN50_ISO-KF belong in BOM mappings and closure identity, not functional_purpose_key."
  - "Vacuum-specific evidence should influence precision and import risk, but not become a Phase 1 functional key axis."
  - "A future Phase 3 schema may need `standard_interface` as a structured field rather than free-form guardrails."

unresolved:
  - "Whether a broader ISO vacuum fittings kit can replace individual standard-interface items without losing closure fidelity."
  - "Whether helium leak testing is required for each item or only for assembled plumbing systems."
  - "Whether early bootstrap should import all certified vacuum fittings despite local manufacturability in principle."
  - "Exact alloy, surface finish, cleaning, passivation, and leak-rate acceptance values for promotion."
