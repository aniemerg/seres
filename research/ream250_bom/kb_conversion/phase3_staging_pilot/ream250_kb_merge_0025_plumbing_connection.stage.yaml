proposed_items:
  - action: create_new
    proposed_item_id: dn63_iso_k_bellows_end_fitting_v0
    phase2_item_id: ream250_dn63_iso_k_bellows_end_fitting_v0
    reason_for_action: Rows 129 and 130 are duplicate/near-duplicate DN63 ISO-K stainless bellows end fittings; existing fitting kits are too broad for this standard-interface closure item.
    kb_like_item:
      id: dn63_iso_k_bellows_end_fitting_v0
      name: DN63 ISO-K bellows end fitting
      kind: part
      unit: unit
      unit_kind: discrete
      mass_kg: 0.412
      material_class: stainless_steel
      notes: Pilot staging item for a stainless DN63 ISO-K flanged bellows end fitting. Rows 129 and 130 map here.
      source_tags:
        - ream250_bom_phase3_pilot
    closure_identity:
      functional_purpose: rigid flanged end connection for a DN63 flexible bellows assembly
      material: stainless_steel_304
      scale_or_capacity:
        per_unit_mass_kg: 0.412
        nominal_interface: DN63_ISO-K
        scale_class: small
      geometry_form: annular_dn63_iso_k_bellows_end_fitting_with_stepped_bore
    process_assumptions:
      primary_process_bucket: plumbing_connector_fabrication_testing
      candidate_existing_processes:
        - process_id: machining_process_turning_v0
          fit: supporting
          reason: Relevant for annular stainless turning.
        - process_id: leak_testing_v0
          fit: supporting
          reason: Relevant for connector leak checks.
        - process_id: vacuum_testing_v0
          fit: supporting
          reason: Relevant if vacuum-level leak acceptance is required.
        - process_id: cleaning_basic_v0
          fit: supporting
          reason: Relevant for vacuum-service cleanliness after machining.
    import_local_decision:
      decision: local_manufacture_candidate_with_precision_guardrails
      is_import: false
      rationale: The item is a machined stainless connector with plausible local machining, cleaning, and leak-test anchors. It is not in the same import class as electronics, optics, or harmonic reducers, but promotion must preserve vacuum guardrails.
      local_path_summary: Machine stainless end fitting, clean, inspect DN63 ISO-K interface, and leak/vacuum test before bellows assembly use.
      existing_kb_pattern_used:
        - "kb/items/parts/fittings_and_valves.yaml: generic fittings are local-modeled, but too broad for ISO-K fidelity."
        - "kb/processes/leak_testing_v0: existing process anchor for leak checks."
        - "kb/items/parts/mirror_optical_flat.yaml: example import caused by optics precision; this connector has precision needs but simpler manufacturing."
      import_risk_factors:
        - Vacuum-clean surface finish and leak-rate acceptance are unresolved.
        - Parent flexible bellows assembly may still be imported even if the end fitting is local.
      local_manufacture_blockers:
        - Need ISO-K surface finish and dimensional acceptance values.
        - Need decide whether helium leak testing is mandatory for promotion.
    promotion_blockers:
      - Need recipe binding for stainless stock, turning, cleaning, and leak/vacuum testing.
      - Need decide whether this item belongs under a broader ISO vacuum fittings kit.
      - Need final material and acceptance test details.

