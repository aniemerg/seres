name: EBF3 gun HV input central conductor
mass: 0.18
unit: unit
unit_kind: discrete
material_class: conductive_metal
notes: >
  Level-3 child of FG-12. Central high-voltage conductor carrying accelerating
  potential from the gun-side receiving terminal into the electron gun
  high-voltage region. Adopted because HV feedthrough/input sources require a
  conductor path; exact material, diameter, creepage clearance, and joint details
  remain deferred. Do not merge with tank-side HV cable conductor.
