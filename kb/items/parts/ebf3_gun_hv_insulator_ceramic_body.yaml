notes: >
  Level-3 child of FG-13. Standalone ceramic insulating body for the gun
  high-voltage insulator. This is intentionally separate from the FG-12 gun HV
  input conductor/feedthrough path. Alumina-class HV insulators are supported by
  external feedthrough/electron-gun sources, but final ceramic grade, shape,
  creepage, dielectric rating, and local manufacturing route remain unresolved;
  see research/ebf3_bom_sources/organized/hv_gun_side_insulation_decomposition_plan.md.
