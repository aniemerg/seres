notes: >
  Child of HV-8. Insulating body for the tank-side high-voltage output bushing.
  This keeps the tank-wall insulation function visible without deciding whether
  the final design is ceramic, oil-impregnated paper, or another HV insulation
  construction. Creepage distance, field stress design, sealing, and material
  readiness remain unresolved; see
  research/ebf3_bom_sources/organized/hv_tank_interface_hardware_plan.md.
