notes: >
  Level-3 child of FG-19. Gun-diagnostic signal feedthrough insert/interface
  marker for carrying pickup and gun-side sensor signals across the vacuum
  boundary. The cabin owns the passive chamber port or shared plate; controls
  own external acquisition and processing. Pinout, coax-versus-multipin choice,
  voltage/current rating, ceramic-to-metal construction, and sealing geometry
  remain unresolved; see
  research/ebf3_bom_sources/organized/beam_diagnostics_decomposition_plan.md,
  research/ebf3_bom_sources/organized/electrical_signal_boundary_review.md, and
  research/ebf3_bom_sources/organized/ebf3_interface_architecture.md.
