id: ebf3_gun_signal_shield_termination_interface
kind: part
name: EBF3 gun signal shield termination interface
mass: 0.05
unit: unit
unit_kind: discrete
material_class: conductive_metal
notes: >
  Level-3 child of FG-19. Physical shield termination/interface marker for
  gun-side diagnostic signal wiring. It keeps the signal-shield boundary visible
  without merging it into protective ground, HV source return, beam-current
  return, or controls-side acquisition. Exact grounding policy, isolation,
  connector geometry, and material/process readiness remain unresolved; see
  research/ebf3_bom_sources/organized/beam_diagnostics_decomposition_plan.md,
  research/ebf3_bom_sources/organized/electrical_signal_boundary_review.md, and
  research/ebf3_bom_sources/organized/ebf3_interface_architecture.md.
