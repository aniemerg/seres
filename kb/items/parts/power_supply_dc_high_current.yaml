notes: 'High-current DC power supply for electrolysis and electrochemical processes.

  Output: 50-200V DC, 100-500A continuous.

  Rectifier-based with current regulation and protection circuits.

  Used in water electrolyzers and smaller electrochemical equipment where a 40 kg
  standalone DC supply is sufficient. Use high_temperature_power_supply_v0 for
  aggregated industrial process power, MRE/refining, or furnace/electrode duty; use
  ffc_power_supply_controlled_v0 for tightly regulated low-voltage FFC cells.

  Components: transformer, rectifier bridge, filter capacitors, current control.

  '
