notes: >
  HV-15 partial representation. Grounding terminal and bonding interface for the
  HV tank enclosure. Earlier scaffold notes used HV-11, but the visible
  high-voltage tank table uses HV-11 for output-voltage sensing; see
  research/ebf3_bom_sources/organized/high_voltage_tank_level_2_audit.md and
  research/ebf3_bom_sources/organized/hv_electrical_interface_review.md. This is
  protective tank bonding only, not the complete beam-current or HV return path;
  see research/ebf3_bom_sources/organized/hv_grounding_return_review.md.
  Shielding and physical service interlock details remain unresolved; see
  research/ebf3_bom_sources/organized/hv_tank_service_protection_review.md. No
  local recipe is attached yet.
