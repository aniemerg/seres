notes: >
  FS-30. Positioning-specific electrical feedthrough interface for passing motor
  power and sensor signals through the chamber boundary. The cabin owns only the
  chamber-side passive opening/flange, controls own acquisition and logic, and
  power supplies own driver outputs. See
  research/ebf3_bom_sources/organized/feedthrough_interface_review.md and
  research/ebf3_bom_sources/organized/four_axis_positioning_level_2_audit.md. No
  local recipe is attached yet.
