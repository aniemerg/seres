notes: Set of press rams and plungers for various pressing operations. Includes different
  sizes and capacities for arbor presses, toggle presses, and hydraulic presses. Hardened
  steel construction for durability under repeated pressing loads. This is tooling
  and force-transfer hardware used with hydraulic_press or another actual press,
  not a standalone force-generating machine. The 30 kg mass represents a shop kit
  of hardened ram noses, adapter blocks, plungers, and simple replaceable rams, not
  the main moving platen, hydraulic cylinder, frame, or controls of a press.
