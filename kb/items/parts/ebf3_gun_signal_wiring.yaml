id: ebf3_gun_signal_wiring
kind: part
name: EBF3 gun sensing and signal wiring
mass: 0.2
unit: unit
unit_kind: discrete
material_class: composite
notes: >
  FG-19. Gun-side sensing and signal wiring assembly for temperature, current,
  beam diagnostic, and interlock signals. This item is limited to local gun-side
  pickups and internal wiring; external DAQ, processing, and control logic
  belong to the controls subsystem. Any vacuum signal feedthrough insert,
  shield termination, or cabinet-side harness remains deferred until a diagnostic
  signal-path decomposition. See
  research/ebf3_bom_sources/organized/feedthrough_interface_review.md and
  research/ebf3_bom_sources/organized/beam_diagnostics_decomposition_plan.md.
