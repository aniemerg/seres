notes: |
  FG-12. Gun-side high-voltage input/feedthrough assembly bringing accelerating voltage from the HV tank or cable into the electron gun high-voltage region. Minimal child BOM: bom_ebf3_gun_hv_input, splitting only the gun-side central conductor, receiving terminal, and local flange/housing. The ceramic feedthrough body, standalone high-voltage insulator, field grading, cable body, and tank-side termination remain deferred or owned by adjacent interface items. Boundary reviewed in research/ebf3_bom_sources/organized/hv_gun_side_insulation_decomposition_plan.md, research/ebf3_bom_sources/organized/feedthrough_interface_review.md and research/ebf3_bom_sources/organized/hv_tank_interface_review.md. Current interface architecture is summarized in research/ebf3_bom_sources/organized/ebf3_interface_architecture.md.
