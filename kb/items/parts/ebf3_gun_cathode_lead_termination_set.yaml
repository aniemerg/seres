id: ebf3_gun_cathode_lead_termination_set
kind: part
name: EBF3 gun cathode lead termination set
mass: 0.05
unit: unit
unit_kind: discrete
material_class: composite
notes: >
  Level-3 child of FG-14. Termination hardware between the cathode current leads
  and the cartridge hot contacts or upstream heater supply interface. Adopted as
  a boundary item so later work can assign welds, clamps, or feedthrough-side
  terminals without merging them into the filament emitter. Exact joint process
  and materials remain deferred.
