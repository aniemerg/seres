notes: Set of crimping tools for electrical and cable connections. Includes ratcheting
  crimp tool for insulated terminals, wire ferrule crimper, coaxial cable crimper,
  modular plug crimper (RJ45/RJ11), and interchangeable die sets for different connector
  sizes. Hardened steel jaws ensure reliable crimps. Used for creating permanent electrical
  connections on wires and cables. Typical wire range 10-22 AWG. Essential for electrical
  assembly, cable harness fabrication, and wiring installations. Modeled as reusable
  connector-specific hand crimping tooling for simulator resource requirements, not
  as a powered automatic crimping station.
