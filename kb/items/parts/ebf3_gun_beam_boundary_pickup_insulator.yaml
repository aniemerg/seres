notes: >
  Level-3 child of FG-9. Local electrical isolation for the beam-boundary
  collector electrode. Adopted because charged-particle pickup sources require
  the collector signal to be isolated from grounded structure. Exact ceramic
  shape, mounting, and feedthrough boundary remain deferred.
