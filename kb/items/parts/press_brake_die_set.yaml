notes: |
  Hardened steel tooling set for press brake metal bending operations. Includes
  upper punches, V-dies/die blocks, mounting hardware, and general-purpose bend
  angles/sizes for straight-line sheet and light-plate forming.

  Modeled separately from press_brake because the machine cannot make controlled
  bends without matched punch/die tooling. Current process uses only require
  general straight bends for brackets, enclosures, frames, motor housings, and
  ventilation hoods; no separate tight-radius, hemming, offset, box-forming, or
  surface-sensitive tooling variant is created in this pass.

  Manufacturing should preserve tool steel stock, machining, heat treatment,
  precision grinding, and dimensional inspection assumptions; do not reduce this
  item to welded fabrication or ordinary mild-steel stock.
