name: EBF3 positioning feedthrough shield termination interface
mass: 0.05
unit: unit
unit_kind: discrete
material_class: conductive_metal
notes: >
  Child of ebf3_positioning_electrical_feedthrough. Shield termination/interface
  marker for positioning motor and signal wiring at the feedthrough boundary.
  It does not define protective grounding, HV return, controls acquisition, or
  cable shield policy for the whole machine. Termination geometry, isolation,
  grounding policy, and local manufacturing route remain unresolved; see
  research/ebf3_bom_sources/organized/ebf3_interface_architecture.md.
