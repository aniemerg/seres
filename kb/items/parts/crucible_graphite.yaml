notes: "Graphite crucible for passive high-temperature melt containment and material\
  \ processing. Withstands temperatures up to about 3000\xB0C in compatible inert,\
  \ vacuum, or reducing service, with good thermal shock resistance and thermal/electrical\
  \ conductivity. Used in metal casting, some glass/material processing, and furnace\
  \ operations where carbon compatibility is acceptable. Does not provide heat,\
  \ atmosphere control, stirring, pouring motion, or safe handling by itself; pair\
  \ with a furnace/heater, tongs/handling tools, molds, and process-specific atmosphere\
  \ or flux controls. Avoid generic use where oxidation, carbon contamination, oxide\
  \ reduction, carbide formation, or high-purity glass/silicon requirements make\
  \ graphite unsuitable."
