notes: |
  Enclosure/booth with ventilation interfaces for coating overspray and fume
  control. Modeled as kind: machine so coating processes can reserve the booth
  enclosure when needed, despite its current file path under parts. Provides
  containment, seals, panel/frame structure, and duct/filter interfaces only.
  Coating application, spray pumping, drying, and curing are supplied by
  coating_station or by separate spray-gun, pump, oven, and ventilation resources.
