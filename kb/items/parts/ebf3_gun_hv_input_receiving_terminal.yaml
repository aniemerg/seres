id: ebf3_gun_hv_input_receiving_terminal
kind: part
name: EBF3 gun HV input receiving terminal
mass: 0.14
unit: unit
unit_kind: discrete
material_class: composite
notes: >
  Level-3 child of FG-12. Gun-side receiving terminal or socket interface for
  the main HV cable from the high-voltage tank. Adopted to make the gun-side
  termination visible while keeping the main cable and tank-side termination in
  the HV tank subsystem. Connector geometry, shield termination, oil/vacuum
  sealing, and service method remain deferred.
