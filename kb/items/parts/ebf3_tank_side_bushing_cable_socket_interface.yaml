id: ebf3_tank_side_bushing_cable_socket_interface
kind: part
name: EBF3 tank-side bushing cable socket interface
mass: 0.2
unit: unit
unit_kind: discrete
material_class: composite
notes: >
  Child of HV-8. Socket or receiving interface for the HV cable on the tank
  side. This is a package marker to keep the tank-side cable interface out of
  the main cable body and out of the gun-side HV input. Connector geometry,
  stress-control transition, and service boundary remain unresolved; see
  research/ebf3_bom_sources/organized/hv_tank_interface_hardware_plan.md and
  research/ebf3_bom_sources/organized/ebf3_interface_architecture.md.
