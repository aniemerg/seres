id: anvil_or_die_set
kind: machine
name: Anvil or die set
mass: 25.0
unit: unit
material_class: steel
capabilities:
  - forging_support
  - die_set_forming
  - open_die_forging_tooling
  - swage_and_fuller_tooling
  - forging_press_die_support
notes: Canonical reusable forging tooling set for general open-die forging under
  a hammer, press, or hand-tool setup. Includes small interchangeable flat dies,
  V-dies, swages, fullers, and anvil tooling surfaces; it does not provide heat
  or forming force by itself. Preserve anvil_block_basic as the heavy fixed anvil
  mass used in power-hammer assemblies. Dedicated closed/impression dies for a
  specific part geometry should be modeled separately when geometry, wear, or
  tolerance matters. The older anvil_and_die_set name is a duplicate of this
  canonical tooling concept.
