id: ebf3_hv_cable_dielectric_insulation
kind: part
name: EBF3 HV cable dielectric insulation
mass: 0.36
unit: unit
unit_kind: discrete
material_class: polymer_dielectric
notes: >
  Level-3 child of HV-9. Bulk high-voltage dielectric insulation around the
  central conductor. External cable sources support EPR or silicone dielectric
  classes for e-beam/x-ray HV cables, but final material, thickness, voltage
  rating, and oil/vacuum compatibility remain deferred.
