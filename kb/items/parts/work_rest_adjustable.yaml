id: work_rest_adjustable
kind: machine
name: Work rest (adjustable)
mass: 10.0
unit: unit
material_class: steel
capabilities:
- adjustable_workpiece_support
- grinder_work_rest_support
- polishing_work_rest_support
- offhand_grinding_safety_support
- height_position_adjustment
notes: Adjustable grinder/polisher work rest and support accessory for positioning
  workpieces close to abrasive wheels, belts, disks, or polishing heads. Provides
  adjustable height/position support, improves control, and helps maintain a safe
  small work-rest gap during grinding and polishing. It is a passive tooling
  accessory, not a powered machine. Lathe steady-rest or follow-rest support should
  be modeled separately if turning-specific support geometry is required.
