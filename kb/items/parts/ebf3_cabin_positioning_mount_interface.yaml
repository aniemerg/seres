notes: >
  MC-8. Chamber floor, access, and passive mounting interface for the four-axis
  positioning subsystem inside the cabin. This assembly is split by
  `bom_ebf3_cabin_positioning_mount_interface`. Positioning axes, platform,
  motors, encoders, cabling, and feedthrough inserts remain in the positioning
  subsystem. See
  research/ebf3_bom_sources/organized/manufacture_cabin_level_2_audit.md. No
  local recipe is attached yet. Keep floor bolt pattern, leveling datum, seals,
  and build-substrate tooling unresolved until chamber/positioner interface
  geometry is selected.
