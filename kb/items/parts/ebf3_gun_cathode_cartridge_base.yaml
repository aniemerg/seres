notes: >
  Level-3 child of FG-15. Replaceable base/holder body for locating the selected
  direct-heated tungsten hairpin/filament cathode package. Adopted as a physical
  child because BINP supports a preliminary adjusted cartridge and electron-gun
  package sources support mounted cathode assemblies. Exact material, datum
  geometry, and precision-machining route remain deferred.
