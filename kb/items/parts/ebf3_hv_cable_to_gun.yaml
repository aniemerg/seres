id: ebf3_hv_cable_to_gun
kind: part
name: EBF3 HV cable to fixed electron beam gun
mass: 1.0
unit: unit
unit_kind: discrete
material_class: composite
notes: >
  HV-9. High-voltage cable carrying accelerating voltage from tank to fixed
  electron beam gun. Boundary note: this item is owned by the high-voltage tank
  subsystem as the main inter-subsystem HV transmission element; the gun owns the
  receiving HV input/feedthrough hardware separately. Tank-side and gun-side
  terminations remain deferred; see
  research/ebf3_bom_sources/organized/feedthrough_interface_review.md,
  research/ebf3_bom_sources/organized/hv_tank_interface_review.md and
  research/ebf3_bom_sources/organized/hv_tank_interface_hardware_plan.md. Cable
  conductor, dielectric, semiconductive layers, shield, jacket, and termination
  details remain unresolved. No local recipe is attached yet.
