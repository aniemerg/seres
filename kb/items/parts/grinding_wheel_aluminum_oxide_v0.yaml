id: grinding_wheel_aluminum_oxide
kind: part
name: Grinding wheel (aluminum oxide)
mass: 6.0
unit: kg
material_class: ceramic
is_import: true
notes: 'Explicit aluminum oxide (Al2O3) abrasive grinding wheel variant for cylindrical
  grinding operations. The generic `grinding_wheels` item is the canonical local
  ISRU vitrified alumina/glass wheel set; prefer that item for ordinary grinding
  resource requirements. Keep this part as an imported/spec-specific variant where
  a recipe or process needs a particular wheel chemistry, grit, form, or quality
  class that the generic set does not guarantee.


  Specifications:

  - Abrasive: Aluminum oxide (Al2O3), brown or white

  - Grit size: Typically 60-120 for general grinding

  - Bond: Vitrified ceramic bond

  - Application: Cylindrical grinding, tool sharpening, general metalworking

  - Consumable: Requires periodic dressing and replacement


  Advantages of Al2O3 grinding wheels:

  - General purpose, works well on ferrous metals (steel, cast iron)

  - Good toughness, maintains sharp cutting edges

  - Widely available and cost-effective

  - Brown Al2O3: Tougher, for roughing operations

  - White Al2O3: Friable (self-sharpening), cooler grinding


  For early bootstrapping or high-certainty dimensional grinding, import high-quality
  aluminum oxide grinding wheels until a process explicitly validates a local variant.

  '
unit_kind: bulk
