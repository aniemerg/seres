notes: 'Set of passive rotating drums/spindles for winding fibers, wires, or cables
  onto spools as part of a complete winding machine or downstream line.

  This item does not provide standalone winding capability. It does not include a
  motor drive, traverse guide, closed-loop tension control, braking system, guarding,
  or process controls; require winding_machine, tension_control_system, or
  process-specific complete winding equipment for active spooling operations.

  Keep distinct from coil_winding_machine, which is a turn-counted electrical coil
  winder. Winding_drums should appear as internal BOM/recipe components of complete
  winders or downstream lines, not as the sole resource for a winding process.

  Includes multiple drum assemblies with mounting shafts and bearings.

  Precision-machined for smooth rotation and material contact.

  Components: cylindrical drums, mounting shafts, bearings, and mounting interfaces.

  '
