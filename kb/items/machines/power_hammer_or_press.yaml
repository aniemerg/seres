notes: |
  Mass updated 2026-01 from 500 kg to 545 kg based on recipe analysis.
  Recipe casts 495 kg of frame/anvil/head structure, then adds 50 kg of drive motor and controls.
  Total: 495 + 50 = 545 kg.

  Interpreted as the canonical basic forging power hammer because the BOM is hammer-like:
  hammer frame, hammer head, drive motor, anvil block, controls, sensors, and power
  conditioning. Provides repeated impact blows for low-volume hot forging after a
  separate heat source such as induction_forge_v0 brings stock to forging temperature.
  Pair with anvil_or_die_set for tooling. Use forging_press_v0 for sustained hot
  press forging, and hydraulic_press for general shop pressing, compaction, bearing
  installation, or straightening. Do not replace this active impact-forging machine
  with labor bots or hand tools; labor covers setup, heating, and manipulation.
capabilities:
- impact_forging
- hot_forging
- powered_hammering
