notes: Central supervisory controller for the Neuroendocrine Immune Manufacturing
  System (NEIMS) seed concept. Built from formation-control hardware, electronics,
  programmed microcontroller firmware, and wiring. Provides coordination and control
  logic only; field sensors, actuators, process machines, and network infrastructure
  should remain separate resources.
