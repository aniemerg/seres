notes: 'Large radiator panel assembly for passive heat rejection via thermal radiation.
  Critical component for thermionic power systems where 70-90% of input thermal energy
  becomes waste heat. High surface area radiator panels with high emissivity coating
  maximize heat dissipation to space. Includes coolant-channel/manifold interfaces
  and mounting hardware, but pumps, valves, reservoirs, cryogenic chillers, and
  closed-loop heat-transport controls are modeled as separate thermal-management
  resources where needed. See: design/solar_thermionics_report.md'
