notes: Configured metal-spinning lathe cell for forming axisymmetric sheet-metal
  shells over mandrels. Reuses a precision lathe as the rotating base and adds
  forming rollers, tailstock or pressure support, hydraulic assist, workholding,
  guards, and controls. Suitable for modest stainless or aluminum tank shells in
  current recipes; large cryogenic tank shells require explicit diameter/thickness
  checks and may need a dedicated large CNC metal spinning or flow-forming machine.
