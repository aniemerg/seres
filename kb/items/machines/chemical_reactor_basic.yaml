notes: Basic steel chemical reactor with heated jacket, agitator, and gas handling
  for small stirred batch or semi-batch liquid reactions. Assumes ordinary steel or
  stainless compatibility, moderate temperature service, agitation, gas inlet/outlet
  ports, pressure relief, and temperature control. Do not use for molten-salt
  electrolysis, high-temperature gas-solid reactions, packed-bed catalysis, strong
  acid/chloride service, refractory service, or high-pressure autoclave chemistry;
  use more specific reactor resources where those constraints matter.
