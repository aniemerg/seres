is_import: true
bom: bom_optical_pyrometer_temperature_sensor_v0
notes: >
  Reusable non-contact line-of-sight temperature sensing assembly for
  high-temperature surfaces and molten materials where contact probes are
  unsuitable, short-lived, contaminating, or inaccessible. Use for molten glass,
  molten regolith electrolysis reactors, casting pour streams or melt surfaces,
  microwave/laser sintering hot spots, and other white-hot process surfaces.
  Requires a clean sight path, sight tube or viewport, emissivity assumptions
  or calibration, and pairing with contact sensors for wall, shell, refractory,
  guard, and safety-limit temperatures. Imported because precision optics,
  detectors, calibration, and signal electronics are not plausible early local
  manufacture items.
