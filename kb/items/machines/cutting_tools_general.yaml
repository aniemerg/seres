id: cutting_tools_general
kind: machine
name: Manual cutting-tool kit
mass: 30.0
unit: unit
material_class: steel
processes_supported: []
notes: Broad manual/basic cutting-tool kit for general cutting, trimming, and rough
  stock-preparation support. Distinct from precision_tooling_set, which represents
  machine-tool cutters such as end mills, drills, reamers, taps, boring bars,
  inserts, and holders for precision machining. Use saw_or_cutting_tool for one
  handheld hacksaw/frame saw, metal_shear_or_saw for powered stock cutting, and
  hand_tools_basic for non-cutting assembly hand tools.
capabilities:
- manual_cutting_tool_inventory
- low_volume_hand_cutting
- trimming_and_deburring_support
- replacement_blade_inventory
- rough_stock_prep_hand_tools
bom: bom_cutting_tools_general
recipe: recipe_machine_cutting_tools_general_v0
unit_kind: discrete
