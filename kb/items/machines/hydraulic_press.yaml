  moderate stroke, and a work envelope suitable for small-to-medium components,
  not as a benchtop jack press or massive production press. Smaller generic press
  aliases remain consolidated into this item. Shape-specific molds, dies, platens,
  ram adapters, and fixture sets remain separate tooling resources where geometry,
  pressure distribution, or part tolerance matters.
