description: 'Overhead hoist or small gantry crane for lifting heavy components during
  assembly.


  Specifications:

  - Load capacity: 500 kg

  - Lift height: 3-4 meters

  - Simple chain hoist with manual or electric winch

  - Steel frame construction with trolley system


  Used for:

  - Motor assembly (lifting housings, rotors, stators)

  - Machine assembly operations

  - Material handling in workshop


  Can be built from structural steel and basic mechanical components,

  or imported as complete unit.

  '
notes: Small rated workshop gantry crane or overhead hoist/trolley system for
  components too heavy or awkward for the 20 kg payload labor_bot_general_v0.
  Model as a 500 kg class shop lifting resource for assembly and maintenance
  positioning, not as a forklift, mobile mining handler, or large construction
  crane. Rigging accessories such as slings, shackles, hooks, trolley hardware,
  chains, beam clamps, and rated fasteners are treated as bundled hoist/rigging
  hardware in this coarse item. Assemblies above the 500 kg rating require a
  higher-capacity crane/hoist variant rather than this resource; examples include
  hip_press_unit_v0, bending_machine_v0, heliostat_unit_v0,
  haber_bosch_reactor_v0, and coordinate_measuring_machine.
