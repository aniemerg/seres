notes: |
  Variant v0 of the coordinate measuring machine used for dimensional inspection.
  Linked to the v0 BOM; placeholder mass/spec for seed material.

  Provides probe-based 3D coordinate measurement for machined parts, tooling,
  bearings, molds, and aligned assemblies where tolerance verification exceeds
  manual calipers or gauge checks. Distinct from inspection_tools_basic and
  measurement_equipment; those cover lower-end or portable metrology, while this
  item represents a dedicated CMM with precision stages, touch probe, control
  software, and reference calibration workflow.
