id: drawing_die_set_basic
kind: machine
name: Drawing die set (basic)
mass: 5.0
mass_kg: 5.0
unit: unit
material_class: steel
capabilities:
- wire_drawing_tooling
- rod_drawing_tooling
- passive_die_set
notes: Canonical basic reusable die set for wire or small-rod drawing. This is passive
  tooling, modeled as kind machine only so processes can reserve it; it must be paired
  with pulling equipment, draw bench/capstan functionality, lubricant, and process
  setup. Supersedes the duplicate wire_drawing_die_set placeholder. Hardened/tool
  steel dies are suitable for low-throughput soft metals such as copper or aluminum;
  steel, Kovar, tungsten, abrasive materials, fine wire, or high-throughput drawing
  may require carbide, PCD, diamond, or refractory-compatible die inserts.
