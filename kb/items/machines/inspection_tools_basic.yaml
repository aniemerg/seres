id: inspection_tools_basic
kind: machine
name: Inspection tools (basic)
mass: 8
unit: unit
material_class: steel
capabilities:
- manual_inspection
- visual_sorting
- basic_dimensional_checking
- shop_inspection_aids
notes: Basic reusable manual inspection aid kit, modeled as a machine resource so
  processes can reserve it alongside labor. Covers magnifiers, rulers/straightedges,
  simple go/no-go gauges, calipers, and visual aids for low-end manual inspection
  and sorting. Does not include micrometers, gauge blocks, dial indicators, electrical
  instruments, optical metrology, CMMs, or calibrated reference standards; use measurement_equipment,
  alignment_tools, optical_metrology_tools, or specific metrology items for those
  cases.
