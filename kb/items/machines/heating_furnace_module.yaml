notes: Modular furnace heating unit with heating elements, insulation, and temperature
  control. Can be stacked or arranged for larger furnace capacity. Includes refractory
  lining, heating elements (resistance or induction), temperature sensors, and control
  interface. Used in heat treatment furnaces, melting furnaces, and process heating
  applications. This is a heating module or hot-zone subassembly; use a complete
  furnace, kiln, vacuum chamber, or atmosphere system when containment, gas handling,
  or full process enclosure behavior is required.
