notes: Station for applying photoresist or similar low-viscosity thin films via
  spin coating. Provides substrate chucking, dispense/spin controls, and containment
  for small wafer or flat-substrate coating. Distinct from coating_station for spray,
  dip, powder, paint, or bulk protective coatings; drying, baking, UV exposure, development,
  etching, and cleanroom environment remain separate resources.
