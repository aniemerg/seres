notes: Small epoxy/resin synthesis reactor skid for producing epoxy resin base from
  precursor chemistry. Includes a corrosion-compatible stirred reactor, metered feed
  addition, heating/cooling, condenser or simple distillation/solvent-recovery module,
  wash/separation support, gas/vent handling, temperature controls, pressure relief,
  and waste/byproduct handling interfaces. Use for epoxy or related resin synthesis,
  not as a generic chemical reactor for unrelated HCl, sulfide, or mineral chemistry.
