notes: Small single-screw plastic extruder for shop/lab production of profiles, simple
  sheet or gasket stock, and coarse filament-like output. Includes feed hopper, heated
  barrel, screw, motor/gearbox drive, die/head, barrel heaters/cooling, controls,
  sensors, and basic instrumentation. Downstream cooling, haul-off, cutting, winding,
  and sheet thickness control are modeled separately by extrusion_downstream_line_basic_v0
  where process geometry requires them.
