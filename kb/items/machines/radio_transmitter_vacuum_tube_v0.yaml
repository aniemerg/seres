notes: 'Vacuum tube based radio transmitter for communications.

  Source: docs/paper_reviews/paper_reviews_dec2024_comprehensive_v0

  Technology: Vacuum tube oscillator and amplifier stages

  Frequency bands: HF (3-30 MHz) or VHF (30-300 MHz)

  Power output: 1-100W typical

  Modulation: AM (amplitude modulation) or CW (continuous wave)

  Components: Oscillator, driver, power amplifier, modulator, power supply

  Tubes: Triodes or pentodes for oscillator and amplifier stages

  Efficiency: 30-60% DC-to-RF typical

  Cooling: Air or liquid cooling for power amplifier

  Applications: Voice communications, telemetry, remote control

  Lunar context: Vacuum tubes ideal for radiation environment, manufacturable locally

  Range: 10-1000 km depending on power, frequency, and terrain

  Critical for: Base-to-rover communications, Earth communications relay

  Scope: transmitter electronics only. Antennas, matching networks, receivers, power
  conditioning, pointing/tracking, and rover-level communications integration are
  separate resources.

  '
unit_kind: discrete
