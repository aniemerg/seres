notes: >
  Canonical Kapvik rover machine ID with six-wheel rocker-bogie configuration and
  modular prospecting payload interface. This entry supersedes
  kapvik_microrover_30kg_v0 and is modeled as a serviceable infrastructure rover
  with explicit subsystem decomposition. Provides mobile platform,
  power/mechanical interfaces, and traverse support for prospecting payloads and
  station measurements. It does not by itself provide excavation, sample drilling,
  autonomous prospecting interpretation, or obstacle avoidance without the
  corresponding payload, drilling, communication, avionics, or AI resources.
