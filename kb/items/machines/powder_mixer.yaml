notes: Small powder blender for metal or ceramic powders, binder/lubricant addition,
  and powder-metallurgy or ceramic feedstock preparation. Kept distinct from mixer_or_blender
  where dry powder uniformity, dust containment, contamination control, or cleanout
  matters; use mixer_or_blender for low-detail generic mixing where material behavior
  is not central. Tumbler or ribbon mixer provides homogeneous mixing for powder
  metallurgy and ceramic forming operations.
