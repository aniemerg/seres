notes: |
  Electrical busbar distribution cabinet for routing power from sources or
  conditioning equipment to multiple loads. Provides low-resistance copper or
  aluminum conductors, insulated supports, mounting brackets, output terminals,
  and guarded enclosure structure for safe high-current distribution to
  industrial equipment such as electrolysis cells.

  Distinct from power_conditioning_equipment, inverters, rectifiers, and
  high-current process power supplies: busbars distribute already supplied or
  conditioned power, but do not convert, regulate, rectify, or control it.
unit_kind: discrete
