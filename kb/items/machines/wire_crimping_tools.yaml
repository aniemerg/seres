notes: Reusable hand/pneumatic wire crimping tool kit for low-volume wiring
  integration, connector terminations, and cable assembly. Includes ratcheting or
  pneumatic crimper frames, interchangeable connector-specific dies, locators, and
  related hand tooling. This is not a standalone automatic cut-strip-crimp machine
  or high-volume harness production line; use a separate crimp press or automatic
  harness machine if throughput requires one.
