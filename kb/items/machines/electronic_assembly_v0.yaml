notes: Low-volume electronic assembly support station for mounting components, wiring
  connectors, integrating populated boards into enclosures, and holding small fixtures
  during soldering, inspection, and test. Distinct from pcb_fab_equipment, which
  covers board fabrication steps such as exposure, etching, drilling, and plating;
  pair this station with soldering_station, electrical test equipment, and labor
  where the process needs controlled soldering or functional verification. Placeholder
  BOM and exact specs remain to be refined.
