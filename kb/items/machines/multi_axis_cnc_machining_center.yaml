bom: bom_multi_axis_cnc_machining_center
notes: High-function multi-axis CNC machining cell. Covers milling, turning/turn-mill
  work, drilling, tapping, boring, reaming, contour and freeform finishing, chamfering,
  deburring, limited tool-based polishing, and on-machine probing/basic dimensional
  checks. It does not by itself close material heat treatment, magnetic-property
  control, chemical cleaning, specialized coating, or independent functional qualification.
