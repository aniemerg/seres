notes: Compact hand-tool kit for refractory lining installation, including hot-wire
  cutting support, trowels, wire brushes, fasteners, and anchor installation hand
  tooling. It does not include powered castable mixing, vibration consolidation,
  ramming, or gunning equipment; require those as separate resources when the
  installation method needs them.
