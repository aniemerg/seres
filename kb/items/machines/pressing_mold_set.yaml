notes: Generic reusable cold powder pressing mold/die set for coarse or low-specificity
  modeling. Includes mold dies, punches, cavity plates, and ejector components used
  with hydraulic, pellet, or molding presses; it does not provide pressing force.
  Use geometry-specific tooling where shape, clearance, ejection, or compaction pressure
  matters, such as ferrite_toroid_pressing_die_set, brick_mold_steel_set, ceramic_press_or_mold_set,
  pellet_press_die_set, or the hot-press-scoped dies item for elevated-temperature
  pressing.
