notes: |
  Heated gas-solid catalytic reactor for fixed-bed, gauze-bed, packed-bed, or
  coarse fluidized/contact-bed service. Provides a reactor shell, catalyst bed
  support/retention, gas inlet and outlet distribution, heat input, temperature
  sensing/control, pressure relief, and offgas interface.

  Use for Ostwald ammonia oxidation, catalytic Claus sulfur recovery, CO oxidation
  cleanup, and Rochow/Mueller gas-solid chloride contact service where process
  notes call for a dedicated catalytic bed reactor.

  Distinct from gas_handling_loop_v0, which moves/recirculates gas; furnace_basic,
  which supplies generic heat; packed_bed_distillation_v0, which is vapor-liquid
  separation/contacting; and chemical_reactor_basic or generic_chemical_reactor_v0,
  which are stirred/jacketed reactor abstractions rather than gas-bed catalytic
  reactors.
