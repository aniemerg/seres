notes: |
  Assumptions:
  - Mass aligned to current recipe component sum (1019.5 kg).
  - Compact/pilot-scale controlled-atmosphere reduction furnace for metal-oxide
    and silicate reduction processes at roughly 1200-1600 C.
  - Includes refractory hot zone, high-temperature electric heating, reductant gas
    handling, offgas manifold collection, cooling, and temperature control.
  - Intended for batch H2/CO/methane and small carbothermal reduction routes such
    as ilmenite, magnesium oxide, and silicon purification intermediates.
  - Not a generic high-temperature furnace, steel refining/melting furnace,
    DRI shaft furnace, rotary kiln, or solar carbothermal receiver. Use
    furnace_high_temp, refining_furnace_v0, solar_concentrator_fresnel_v0, and
    dedicated gas/offgas resources for those routes as appropriate.
