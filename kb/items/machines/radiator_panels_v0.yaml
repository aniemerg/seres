notes: |
  Radiator panel assembly for generic thermal management; coarse mass estimate.
  Includes radiator panel set, heat-pipe or loop interfaces, heat transport loop
  assembly, sensors, controls, and mounting/fastening hardware. Used with
  heat_transport_system and thermal_control_valves for continuous waste-heat
  rejection. Distinct from heat_rejection_radiator, which is the thermionic/process
  passive radiator assembly, and from heat_transport_system, which moves heat to
  the radiator.
