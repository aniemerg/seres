notes: |
  Generic low-end stamping press for repetitive sheet-metal blanking, punching,
  and shallow forming with matched dies. The current build path is consistent with
  a small hydraulic or mechanical C-frame/gap-frame press at coarse KB fidelity.

  Scope: suitable for low-throughput sheet parts and basic lamination stamping
  when a die set, guided platens, guards, and repeatable stroke control are
  assumed. It is not a complete high-speed motor lamination line; feeder,
  stacker, progressive die, and scrap-conveyor automation must be modeled
  separately if production lamination throughput is required.

  Keep distinct from hydraulic_press: a generic shop hydraulic press can provide
  force for pressing, straightening, and compaction, but stamping needs die
  alignment, ram guidance, guarding, and repeatable stroke behavior.
