notes: |
  Power distribution system for mobile equipment and facilities. Includes breakers,
  cables, distribution panels, branch-circuit protection, and load-side routing for
  ordinary equipment and facility loads.

  This item models general low-to-moderate current distribution. Use
  power_distribution_bus for high-current busbar distribution to industrial loads,
  and power_conditioning_equipment or specific supplies/inverters for conversion,
  voltage regulation, or source/load matching.
