notes: |
  Active power-conditioning unit for thermionic converter outputs. Thermionic
  converters produce source/load behavior that differs from PV inverter duty, so
  this unit covers DC/DC conversion, voltage/current regulation, load matching,
  filtering, protection, monitoring, and thermal management for thermionic power
  systems.

  Assumed rating is roughly 5 kW continuous at coarse KB fidelity, with thermionic
  converter DC input, regulated DC bus output, optional downstream conversion, and
  enclosure/cooling sized similarly to the generic 80 kg power-conditioning
  cabinet. Labor bots install, wire, and commission the unit; they do not replace
  the active conversion hardware.
unit_kind: discrete
