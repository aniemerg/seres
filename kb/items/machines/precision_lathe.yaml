id: precision_lathe
kind: machine
name: Precision lathe
mass: 1200.0
unit: unit
bom: bom_precision_lathe_v0
material_class: steel
capabilities:
- precision_turning
- facing
- threading
- boring
- shaft_machining
- precision_machining
notes: |
  Toolroom/precision lathe for turning, facing, threading, boring, and concentric
  shaft work where spindle runout, bed straightness, feed accuracy, rigidity, and
  repeatable setup matter. Keep distinct from lathe_engine_v0, which represents a
  lower-tier general engine lathe, and from milling machines, which use different
  cutting geometry.

  Intended tolerance tier for v0 modeling is roughly 0.01 mm for careful turning
  and about 0.005 mm only with suitable tooling, workholding, coolant, metrology,
  and finishing passes. Parts needing better roundness, bearing-journal finish,
  screw accuracy, or hardened surfaces should add grinding/lapping and inspection
  resources rather than assuming the lathe alone is sufficient.
processes_supported:
- ball_screw_fabrication_v0
- knob_control_dial_machining_v0
- lathe_headstock_turn_v0
- lead_screw_fabrication_v0
- machining_process_turning_v0
- valve_body_boring_v0
recipe: recipe_precision_lathe_v0
