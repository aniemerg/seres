notes: Workstation for glass fabrication including lampworking, tube forming, and
  glass-to-metal sealing. Includes torch or burner, work surface, annealing oven,
  ventilation hood, and tool set. Used for making vacuum tubes, glass insulators,
  laboratory glassware, and optical components from compatible pre-melted glass stock.
  Can work with borosilicate, soda-lime, and quartz glass in small sections. Bulk
  glass melting, fining, and large pours remain the role of glass_furnace_v0 or
  glass_casting_v0.
