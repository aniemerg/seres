id: pipe_threading_tools
kind: machine
name: Pipe threading tools
mass: 12.0
unit: unit
material_class: steel
capabilities:
- external_pipe_thread_cutting
- npt_taper_threading
- manual_die_head_threading
- pipe_vise_workholding
- thread_gauge_verification
- plumbing_and_pneumatic_pipe_prep
notes: Set of pipe threading tools for cutting external threads on pipes. Includes
  manual pipe threader (die head), assorted threading dies (1/2" to 2" NPT), pipe
  vise, cutting oil applicator, and thread gauges. Essential for plumbing and pneumatic
  system installation. Creates NPT (National Pipe Thread) tapered threads for leak-tight
  connections. Scope is pipe-end preparation and field/shop installation support,
  not precision screw, bolt, leadscrew, or internal tapped-hole production.
