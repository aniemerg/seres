notes: Pressure-rated steel vessel shell with fittings, gaskets, and code-style weld
  and pressure-test assumptions. Used as a component in chemical reactor BOMs and as
  a reservable vessel for simple pressurized hydrothermal or hydration processes.
  It provides pressure containment only; heat, agitation, metering, gas control, and
  chemistry-specific corrosion protection must come from paired equipment or process
  assumptions.
