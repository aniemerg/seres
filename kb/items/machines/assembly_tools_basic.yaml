notes: |
  Basic assembly workstation and tool bundle, modeled as a machine resource because
  many processes reserve a repeatable assembly station rather than a portable hand
  kit. Includes a station frame or bench, the general tool/fixture bundle, clamps
  and holders, power distribution/conditioning for small powered drivers or test
  aids, simple sensors, imported control/compute support for guided assembly, bins,
  and ESD/electrical assembly provisions where relevant.

  This item is intentionally distinct from hand_tools_basic, hand_tools_mechanical,
  and hand_tools_electrical. Those are portable manual tool kits for labor-bot or
  maintenance work; assembly_tools_basic is the bench/station resource used for
  repeatable mechanical/electrical assembly workflows. It does not replace
  connector-specific crimping tools, soldering stations, precision metrology,
  welding tools, hydraulic-service tooling, powered machining/cutting equipment,
  or process-specific fixtures.
