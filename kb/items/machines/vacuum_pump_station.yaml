notes: Integrated vacuum pumping station for evacuating small chambers, process
  lines, tube assemblies, and sealed equipment. Bundles a small vacuum pump with
  gauges, valves/seals, controls, housing, and supporting vacuum hardware for
  rough-to-medium vacuum pumpdown and controlled evacuation workflows. Distinct
  from vacuum_pump_small, which is the standalone pump component, and from
  vacuum_chamber or controlled_atmosphere_chamber, which provide the sealed
  processing volume.
