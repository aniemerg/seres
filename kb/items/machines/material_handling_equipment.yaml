  Modular material handling unit (small conveyor + cart interface) for moving
  bulk materials/parts between stations. Includes powered belt, frame, idlers, drive,
  and basic controls. Represents an integrated shop-floor transfer and staging
  station, distinct from the standalone conveyor_belt_system_v0 subsystem,
  mining loaders/excavators, overhead cranes, and precision robot manipulators.
