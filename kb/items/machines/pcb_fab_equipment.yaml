- single_double_sided_pcb_prototyping
- coarse_trace_masked_pcb_work
notes: Aggregated small PCB prototyping/fabrication station for coarse KB modeling.
  Includes UV exposure, photoresist develop/rinse, chemical copper etch, PCB drilling
  or routing, simple tinning/plating or surface finish, chemical bath ventilation,
  and basic controls. Produces simple single- and double-sided boards from
  copper-clad laminate with approximately 0.2-0.5 mm traces. This station does not
  represent industrial multilayer PCB fabrication, fine-pitch HDI, reliable plated
  through-hole production, soldermask, silkscreen, automated electrical test, or
  semiconductor/solar-cell cleanroom photolithography. Use pcb_fab_station only as
  a deprecated/generic alias; use pcb_fab_equipment when the complete bench-scale
  PCB lab capability is intended.
processes_supported:
- photolithography_process_simple_v0
- pcb_fabrication_v0
- pcb_fabrication_process_v0
- photolithographic_coil_winding_v0
