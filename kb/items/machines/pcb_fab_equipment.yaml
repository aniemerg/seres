id: pcb_fab_equipment
kind: machine
name: PCB fabrication equipment
mass: 435.3
unit: unit
bom: bom_pcb_fab_equipment_v0
capabilities:
- simple_pcb_fabrication
- pcb_photolithography
- pcb_development_and_etching
- pcb_drilling_and_routing
