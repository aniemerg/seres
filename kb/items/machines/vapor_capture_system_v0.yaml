notes: "Integrated water/volatile vapor capture and cold-trap condensation system\
  \ for thermal regolith extraction. Primary scope is H2O capture from polar ice\
  \ or hydrated/mineral volatile processing, not arbitrary acid gas, ammonia, or\
  \ metal-vapor recovery.\n\nComponents:\n- Cold trap module: chilled surface/chamber\
  \ to condense or freeze vapor\n- Collection manifold: piping to gather vapor from\
  \ heated regolith or compatible volatile source\n- Condensate/ice reservoir: tank\
  \ or removable cold surface for collected water\n- Vacuum pump: active pressure\
  \ control and vapor transport support\n- Heat exchanger/coolant loop: rejects condensation\
  \ and pump heat\n- Sensors and controls: temperature, pressure, and fill monitoring\n\
  \nRelationship to nearby items:\n- cold_trap_module_v0 is the internal trap module\
  \ used inside this integrated system.\n- vapor_condenser_cold_trap is a smaller\
  \ condenser/cold-trap component for process-specific condensers.\n- cryogenic_chiller_v0\
  \ supplies lower-temperature cooling where required, rather than being implied\
  \ by this item.\n- gas_scrubbing_unit_v0 should be used for corrosive/reactive\
  \ acid gas cleanup or absorption.\n\nOperating temperature: usually near 0-10°C\
  \ for liquid water condensation, or below 0°C for ice capture when the process\
  \ requires frozen collection.\n\nCapacity: Designed for kg/hr scale water extraction.\n\
  \nApplications:\n- Polar ice extraction: capture sublimed/evaporated water from\
  \ heated regolith\n- Thermal water extraction: condense desorbed water from minerals\n\
  \nLunar context: Essential for water ISRU at polar permanently shadowed regions.\n\
  \nMass estimate: Based on similar thermal extraction equipment.\nSource: ai_estimate,\
  \ scaled from vapor_condenser_cold_trap part\n"
