notes: Magnetic separation equipment for mineral processing. Uses permanent magnets
  or electromagnets to separate magnetic minerals (iron, magnetite, ilmenite) from
  non-magnetic gangue. Belt, drum, or cross-belt configurations. Essential for iron
  ore beneficiation and recovery of magnetic minerals from regolith; distinct from
  density separators, electrostatic separators, and chemical leaching equipment.
