notes: |
  Deprecated legacy vibrating-deck screen item. Consolidated into
  screening_equipment, which is the canonical compact vibratory screen/sieve
  classifier for regolith, aggregate, and powder particle-size separation.

  Historical scope: separated feed into size fractions using screen mesh/deck
  motion; not a crusher, grinder, or density separator. Subtype details such as
  screen deck, vibration drive, springs/frame, hoppers, controls, and sensors are
  preserved in screening_equipment and bom_screening_equipment_v0. This deprecated
  alias intentionally has no BOM or recipe; use screening_equipment for construction
  and process requirements.
unit_kind: discrete
