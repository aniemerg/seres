notes: Consolidated compact-shop CNC milling machine (formerly milling_machine_cnc).
  The 785 kg mass represents a serious compact CNC mill or small VMC-class resource,
  not a full production vertical machining center unless a future review updates
  the mass and BOM. 3-axis or multi-axis motion control with spindle speeds up
  to 10,000+ RPM, CNC controller, servo motors, and tool changer. Use for precision
  milling operations. Build requirements include a rigid base/column, precision
  ways or linear guide rails, ballscrews or leadscrews, spindle bearings/head, drives,
  workholding, machine-tool cutter/toolholder inventory, alignment/calibration
  tools, and metrology for setup and acceptance cuts. Mass aligned to current BOM
  components.
