notes: |
  Battery/flywheel storage bank for buffering generated electrical energy,
  supporting charge/discharge cycles, short-duration backup power, and load
  leveling. Coarse mass estimate.

  Scope is energy storage capacity and storage management, not voltage conversion
  or distribution. Use power_conditioning_equipment or inverter_dc_to_ac_v0 for
  conversion/regulation, and power_distribution_bus for high-current routing to
  loads. Specific battery chemistry or flywheel implementation should be modeled
  with narrower items when the process depends on chemistry, cycle life, vacuum
  housing, or safety constraints.
