notes: Coarse low-volume shop forming equipment bundle, not a single standard machine
  and not the same entity as the metal_forming_basic_v0 process template. Retained
  only for miscellaneous forming cases where the exact forming mode is intentionally
  coarse. Prefer hydraulic_press for pressing/straightening/compaction, press_brake
  for straight-line sheet bends, plate_rolling_mill for rolling, and power_hammer_or_press
  for impact hot forging. Assumes light industrial capacity with limited sheet/plate
  thickness, modest throughput, interchangeable fixtures/tooling, guards, rollers,
  and press tooling; labor bots handle setup and positioning, not high-force forming.
capabilities:
