bom: bom_tube_bender_v0
notes: Light-industrial tube/pipe bending machine for controlled bends in metal
  tubing, distinct from sheet-metal press brakes and generic forming presses.
  Default scope is small to mid-size tubing, roughly 6-50 mm outside diameter and
  0.5-3 mm wall thickness, with bend quality limited by material, bend angle,
  centerline radius, die/follower tooling, mandrel or wiper-die availability, and
  setup repeatability. Suitable for piping assemblies, hydraulic or pneumatic
  lines, heat-exchanger coils, and structural tube sections. Split hand, mandrel,
  hydraulic, or CNC variants only when tighter radius, thin-wall tube, production
  repeatability, or larger pipe scale needs to be modeled.
