bom: bom_vacuum_pump_small_v0
notes: Small oil-sealed rotary-vane or equivalent diaphragm/roughing pump for laboratory
  and light industrial applications. Canonical small pump for rough to medium vacuum
  in leak testing, chamber pumpdown, controlled-atmosphere purge cycles, and as a
  backing pump for higher-vacuum equipment. The Moon's near-vacuum ambient reduces
  external atmosphere load for vented exterior hardware, but sealed chambers, process
  lines, glove boxes, furnaces, tubes, and volatiles systems still need active pumping
  to remove residual gas, control pressure, purge contaminants, and handle outgassing.
  Do not assume clean high vacuum, ultra-high vacuum, high throughput, corrosive-vapor
  compatibility, or oil-free operation unless a process adds the appropriate pump
  station, traps, filters, gauges, valves, materials, or high-vacuum stage explicitly.
