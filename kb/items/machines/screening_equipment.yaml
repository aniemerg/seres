notes: Compact vibratory screen/sieve classifier for particle-size separation of
  regolith, aggregate, and powder streams. Scoped as a 56 kg bench/pilot process
  screener, not a large mining screen or a hand sieve; assume one or two screen
  decks, replaceable mesh, frame, vibration drive, feed and collection bins, and
  basic dust containment. Typical use is separating coarse/fine fractions, removing
  oversize or agglomerates, and preparing a narrower particle-size distribution
  before downstream concentration. Distinct from gravity_separator, which separates
  by density or specific gravity rather than particle size. Fine metal-powder
  sieving that needs inert atmosphere, ultrasonic assist, or contamination control
  should use a powder-grade system such as metal_powder_sieving_system_v0. This is
  the canonical replacement for deprecated vibrating_screen_v0.
