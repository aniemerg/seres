notes: Light shop horizontal bandsaw or cold-saw-class cutoff machine for cutting
  bar, tube, billet, pipe, and structural sections to length. Use for stock-prep
  cuts where a manual hacksaw is too small or low-throughput. Does not provide
  straight guillotine shearing of sheet or plate; use sheet_metal_shear for that
  geometry. Mass retains the current 78 kg light-shop assumption from
  metal_shear_or_saw rather than modeling an industrial automatic saw.
