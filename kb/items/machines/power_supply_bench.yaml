notes: |
  Bench power supply for testing, electronics work, and low-power applications.
  Provides adjustable DC voltage, current limiting, and constant-voltage or
  constant-current operation for electronics assembly, circuit bring-up, and
  small experimental rigs.

  This is a standalone low-power bench instrument. Use test_bench_electrical for
  integrated electronics test workflows, high_temperature_power_supply_v0 or
  ffc_power_supply_controlled_v0 for industrial/process electrolysis power, and
  power_distribution_bus for power routing infrastructure.
