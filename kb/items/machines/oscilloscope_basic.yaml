notes: Basic oscilloscope for viewing and measuring electrical waveforms. Analog or
  digital storage oscilloscope with 2-4 channels, bandwidth 20-100 MHz, sampling rate
  100 MS/s-1 GS/s. Displays voltage vs. time graphs for troubleshooting circuits,
  measuring signal frequency/amplitude, and verifying circuit operation. Includes
  voltage probes, triggering controls, and measurement cursors. It is modeled as an
  imported discrete instrument and BOM component of test_bench_electrical. Prefer
  test_bench_electrical for process-level electronics testing and calibration
  requirements; keep this item for inventory, bench composition, and explicit
  standalone instrument modeling.
