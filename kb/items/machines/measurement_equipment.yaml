notes: "Calibrated measurement and metrology equipment set for manufacturing quality
  control and machine setup, including calipers, micrometers, dial indicators, gauge
  blocks or reference standards, precision machinist levels or electronic inclinometers,
  multimeters, cases/holders, and calibration support. Use this kit for precision
  level and angular checks after consolidating the older precision_levels item. Full
  CMMs, optical metrology benches, interferometers, specialized laser alignment
  systems, large surface plates, and dedicated height-gauge stations remain separate
  resources such as coordinate_measuring_machine_v0, optical_metrology_tools, and
  granite_surface_plate_large. Small setup references such as gauge blocks are included;
  heavy layout bases and advanced coordinate measurement are not hidden inside this
  30 kg portable/bench metrology kit."
