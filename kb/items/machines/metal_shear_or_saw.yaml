notes: |
  Light shop metal stock-prep station: mechanical shear, bandsaw, or equivalent
  powered cutter for plate, sheet, bar, tube, and structural sections at coarse KB
  resolution. Prefer sheet_metal_shear for straight sheet/plate cuts and
  metal_cutting_bandsaw for bar, tube, billet, pipe, and structural sections when
  process geometry matters. Use saw_or_cutting_tool for small manual cuts.
  Assumptions:
  - Mass aligned with recipe inputs (~78 kg), consistent with a light bandsaw or
    compact shop cutting station, not an industrial hydraulic plate shear.
