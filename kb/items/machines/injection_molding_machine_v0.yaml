notes: |
  Small thermoplastic injection molding machine for molded housings and small
  plastic parts from pellets. Includes hopper/feed, heated screw/barrel/nozzle,
  hydraulic or electric clamp/platens, mold mounting and ejection support, cooling
  loop, temperature control, and basic safety/control electronics.

  Distinct from molding_press_basic, which provides compression/platen pressing
  without melt injection, and from plastic_extruder, which continuously pushes
  polymer through a die for profiles, sheet, gasket stock, or filament-like output.
  Part-specific injection molds remain separate tooling where geometry matters.
