notes: |
  Dedicated low-temperature aqueous electrowinning cell for sulfate or similar
  metal-bearing solutions. Created from electrolysis_cell_unit_v0 split review:
  the generic 25 kg cell is not a realistic shared resource for cobalt
  electrowinning, chlor-alkali, Hall-Heroult, and molten-regolith electrolysis.
  Coarse BOM includes tank shell, plate/grid electrodes, copper bus bars,
  circulation plumbing, ventilation, gas collection, control panel, and DC
  power-interface hardware.
