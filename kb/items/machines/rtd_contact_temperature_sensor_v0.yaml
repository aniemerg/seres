id: rtd_contact_temperature_sensor_v0
kind: machine
name: RTD contact temperature sensor assembly
mass: 0.20
mass_kg: 0.20
unit: unit
unit_kind: discrete
capabilities:
  - temperature_measurement
  - thermal_sensing
  - contact_temperature_measurement
  - rtd_temperature_measurement
  - low_medium_temperature_monitoring
  - precision_temperature_monitoring
is_import: true
bom: bom_rtd_contact_temperature_sensor_v0
notes: >
  Reusable low-to-medium-temperature contact sensing assembly for coolant loops,
  chamber walls, furnace shells, press frames, hydraulic systems, electronics
  bays, lower-temperature platens, and calibration/reference points. Default
  BOM reuses existing nickel RTD parts; platinum Pt100-style RTDs can be
  substituted under the same item if available, without creating a separate KB
  item unless scarcity or capability differs by more than the 5x rule. Not
  intended for furnace hot zones, molten materials, molten glass, or molten
  regolith. Imported until stable RTD elements, encapsulation, lead attachment,
  and precision resistance calibration are locally manufacturable.
trust_tags:
- untrusted_global_kb
- machine_audit_imported
