notes: |
  Coarse integrated mineral processing unit for early KB modeling. Represents a
  controlled skid or line-level support machine around feed handling, process
  control, sensing, power conditioning, and dust-managed routing between crushers,
  screens, and density-separation equipment. It is not a standalone universal
  refinery: current process references still require specific rock_crusher_basic,
  screening_equipment, gravity_separator, or dust_collection_system resources when
  those operations are explicitly modeled. Use it for tailings conditioning and
  line integration where finer submachine capacity is not yet resolved.
