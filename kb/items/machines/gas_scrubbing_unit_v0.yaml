notes: Compact gas scrubbing module with vessel/frame and replaceable filter or
  reactive-media cartridge for safety cleanup of process exhaust streams. Suitable
  for polishing corrosive, toxic, or particulate-laden offgas in small processes
  such as ammonia recovery or high-purity glass handling. Distinct from broad
  offgas_handling loops that include fans/ducting/manifolds and from vapor capture
  or cold-trap systems that condense recoverable volatiles.
