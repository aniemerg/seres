notes: Legacy coarse reactor placeholder retained for compatibility with older queue
  seeds and processes. For new or audited references, prefer chemical_reactor_basic
  as the canonical small stirred/jacketed reactor for moderate liquid or gas-liquid
  chemistry. The 250 kg scope here covers a steel vessel/shell, pressure-vessel
  body, basic piping/fittings, control panel, wiring, instrumentation interfaces,
  and integration testing; it does not fully model corrosion lining, qualified
  high-pressure relief design, packed catalyst beds, high-temperature tube service,
  hazardous carbonyl/offgas safety, or process-specific heat-transfer internals.
  Do not use as a substitute for acid_reactor_v0, ffc_reactor_unit_v0,
  haber_bosch_reactor_v0, sabatier_reactor_co2_reduction_v0, carbonyl safety/gas
  handling resources, or other specialized reactors when those chemistry-specific
