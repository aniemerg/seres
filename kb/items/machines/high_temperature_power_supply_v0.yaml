notes: Industrial high-current process power supply for high-temperature electrolysis,
  resistive/electrode furnace service, refining, and similar process loads. Name is
  historical; the supply itself is not a hot-zone component. The 320 kg mass includes
  transformer/rectifier or SCR-converter hardware, power conditioning, bus bars,
  cooling loop, controls, sensing, enclosure, grounding/insulation, and safety
  interlocks. Do not use for ordinary electronics testing or bench power; use
  power_supply_bench for those cases. Keep distinct from
  ffc_power_supply_controlled_v0 where a process specifically needs tightly regulated
  low-voltage FFC electrolysis, and from power_supply_dc_high_current for smaller
  standalone electrolysis or equipment BOMs.
