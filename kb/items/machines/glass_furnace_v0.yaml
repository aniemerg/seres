notes: Small refractory-lined electric glass melting furnace, sized as a lab/studio
  or pilot pot, crucible, or day-tank-style melter rather than an industrial
  continuous tank furnace. Provides high-current resistance heating, temperature
  sensing/control, refractory molten-glass containment, cooling where needed, and
  short-batch holding/pouring support for compatible soda-lime/aluminosilicate,
  basalt, and selected fused-silica/quartz work when refractory and element
  temperature ratings are adequate. Does not by itself provide annealing schedules,
  lampworking/envelope forming, forehearth conditioning, fiber drawing, sheet
  forming, or precision glass-part tooling; require downstream resources such as
  annealing_oven_small, glassworking_station, glass_casting_v0, or
  fiber_drawing_tower where those functions are needed.
