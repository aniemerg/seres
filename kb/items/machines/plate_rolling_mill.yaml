notes: Plate rolling mill for flat rolling and reduction of metal ingots, billets,
  slabs, plate, sheet, strip, and bar stock. Heavy work rolls compress stock through
  multiple passes to achieve target thickness or section. Includes work rolls, rigid
  frame, drive, roll-gap adjustment, alignment, guards, and controls; it is not a
  plate roll-bending machine for curved shells. Treat the 1501 kg v0 item as a small
  light-industrial mill with limited working width, nominally up to about 500 mm
  sheet/plate width and modest bar or light plate sections, for steel and nonferrous
  alloys within compatible roll loads. Hot rolling, reheating, annealing, and temper
  control require separate furnace resources such as furnace_basic or annealing ovens;
  the mill itself only provides the mechanical reduction and handling interface.
