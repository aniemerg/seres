notes: Programmable chamber heat-treatment furnace for controlled metallurgical
  cycles including hardening, tempering, annealing, and stress relief. Provides
  repeatable ramp, soak, and controlled-cooling profiles with part racks/baskets,
  temperature feedback, and furnace uniformity suitable for batch metal heat
  treatment. Distinct from furnace_basic or furnace_high_temp generic heating,
  reduction_furnace_v0 chemical reduction, and sintering_furnace_v0 powder
  densification. The furnace does not implicitly include vacuum, inert/protective
  gas, carburizing/nitriding atmosphere, magnetic-field fixtures, or quench media;
  processes needing those functions should require separate atmosphere, field, or
  quench resources. Mass aligned to BOM component sum (~537 kg).
