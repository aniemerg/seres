notes: Canonical low-temperature forced-air drying and curing oven for removing
  moisture from materials and parts. Temperature range is about 50-300 C with air
  circulation, exhaust/venting, insulated chamber, heating elements, and temperature
  control. Use for drying powders, green ceramics/refractories, coatings, and
  heat-curing adhesives. Do not use for annealing or stress relief, kiln firing,
  ceramic sintering, vacuum drying, or inert-atmosphere drying; those require
  annealing_oven_small, kiln/furnace equipment, vacuum equipment, or atmosphere
  control resources as appropriate.
