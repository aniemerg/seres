notes: |
  Precision Cartesian XYZ positioning stage for accurate part placement,
  measurement, and inspection. Built from linear rails, ball screws, precision
  stepper axes, mounting plates, wiring, electronics, and calibration.

  Scope: larger assembled positioning machine/stage for fixture and inspection
  work. Distinct from linear_stage_xyz_precision, which is a smaller part-level
  XYZ stage, and from stewart_platform_calibrator, which provides six-axis
  roll/pitch/yaw pose alignment for optical concentrator calibration.
recipe: recipe_precision_stage_v0
