name: PCB development station
mass: 200.0
unit: unit
material_class: composite
capabilities:
- photoresist_development
- pcb_develop_rinse
- wet_process_handling
- developer_solution_circulation
- pcb_lab_submodule
processes_supported: []
notes: PCB photoresist development and rinse station for exposed copper-clad boards
  or patterned substrates. Current 200 kg mass assumes an enclosed pumped wet bench
  with reservoir, spray/circulation plumbing, controls, sensors, service frame,
  and secondary containment rather than minimal manual trays. Treat as a wet-process
  submodule of pcb_fab_equipment, not a standalone full PCB factory; etching, drilling,
  tinning/plating, and inspection are modeled by other PCB fabrication resources.
