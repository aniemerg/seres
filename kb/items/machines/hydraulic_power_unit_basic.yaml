name: Hydraulic power unit (basic)
mass: 150.0
unit: unit
bom: bom_hydraulic_power_unit_basic_v0
material_class: steel
capabilities:
- hydraulic_power
- fluid_power
- pressurized_hydraulic_flow
- hydraulic_power_pack
- valve_manifold_supply
- pressure_relief_protection
notes: Basic hydraulic power pack/subassembly that converts electric motor power into
  pressurized hydraulic fluid flow. Includes reservoir, hydraulic pump, motor, valve
  manifold, relief valve, filtration/ports through the manifold, power terminals,
  fasteners, and basic controls. Supplies hydraulic power to cylinders, presses,
  clamps, drilling equipment, mobile equipment, and configured tooling cells, but
  is not itself a hydraulic press or actuator. Keep separate from hydraulic_press
  and other hydraulic machines so multiple machine BOMs can reuse the same HPU model.
recipe: recipe_hydraulic_power_unit_basic_v0
unit_kind: discrete
