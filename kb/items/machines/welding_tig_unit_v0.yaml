notes: TIG/GTAW add-on package for near-vacuum welding. Represents reusable torch,
  leads, local controls, and electronics layered on a separate welding_power_supply_v0;
  it does not include a welding power supply. Near-vacuum operation does not require
  oxygen-atmosphere shielding hardware, and air or water cooling is not assumed available.
  Recipes/processes requiring TIG welding should require both this add-on package
  and welding_power_supply_v0.
