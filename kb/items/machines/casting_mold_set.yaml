notes: Reusable foundry mold tooling kit for non-ingot part casting. Includes flasks,
  pattern equipment, cope/drag boards, core boxes, gating/risering aids, and a small
  inventory of reusable permanent mold tooling. It does not include consumable molding
  sand or binder, and it is not a universal set of mold cavities for every geometry;
  complex parts need part-specific patterns, cores, or permanent molds.
