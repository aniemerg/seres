notes: Combined punch press and drill machine for making holes and cutouts in sheet
  metal and plate. Hydraulic or mechanical punch mechanism plus drill spindle.
  Intended for low-volume fabrication holes and simple cutouts in sheet or light
  plate; use drill_press for ordinary vertical shop drilling, stamping_press_basic
  for repetitive die-guided stamping/forming, and drilling_equipment_v0 for field
  or mining drilling.
