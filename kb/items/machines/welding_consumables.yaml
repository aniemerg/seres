notes: Set of welding rods, filler wire, and consumable materials for welding operations.
  Modeled here as a managed consumable inventory/resource for legacy process requirements,
  not as welding equipment. Actual welding capability comes from welding_power_supply_v0,
  welding_tig_unit_v0, or another process-appropriate welder. Recipes should consume
  process/material-compatible filler such as welding_rod_steel, filler_wire_basic,
  aluminum_wire, flux_brazing, or a more specific electrode/gas item instead of consuming
  this whole kit as generic reusable equipment.
unit_kind: discrete
