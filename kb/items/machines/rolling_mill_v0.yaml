notes: |
  Deprecated legacy rolling mill item. Consolidated into plate_rolling_mill, the
  canonical flat rolling/reduction resource for ingots, billets, sheet, plate,
  strip, and bar stock.

  Historical scope was hot and cold rolling to achieve electrical steel sheet
  gauge. Active process requirements should use plate_rolling_mill plus separate
  heat-treatment, surface-preparation, coating, or metrology resources where the
  process requires annealing, descaling/pickling, insulation coating, or tighter
  gauge control. Build paths belong on plate_rolling_mill, not this deprecated
  alias.
unit_kind: discrete
