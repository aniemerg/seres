notes: Temperature-controlled hand soldering station for low-volume electronics
  assembly, wiring termination, tinning, touch-up, and inspection-supported repair.
  Scope includes the controller/base, heated handpiece, interchangeable tips, tip
  holder/stand, temperature feedback/control, and ESD-safe bench accessories. This
  item provides controlled heat only; soldering processes should also require labor
  and appropriate assembly or test tools. It is distinct from reflow ovens, wave
  soldering machines, pick-and-place equipment, and hot-air/desoldering rework
  stations. The 8 kg mass represents a rugged bench station with stand, tips, and
  accessories, not only a compact bare controller.
