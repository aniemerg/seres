notes: |
  Compact refractory-lined shaft/cupola-style smelting furnace for batch iron-ore
  or ilmenite carbothermal reduction at pilot/foundry scale. Includes or depends
  on forced-air blast, tuyeres, charging hardware, refractory lining, tapping
  hardware, cooling, and exhaust/offgas handling.

  Despite the historical ID, this is not a universal blast furnace, aluminum
  smelter, copper smelter, steel refining furnace, induction remelting furnace, or
  crucible furnace. Use Hall-Heroult cells for aluminum, refining_furnace_v0 for
  steel/stainless refining, induction_furnace_v0 or furnace_basic for remelting,
  and crucible resources for small specialty melts. The current active process
  use is iron_smelting_reduction_v0; broader furnace-family splits should be done
  by process family if new references appear.
