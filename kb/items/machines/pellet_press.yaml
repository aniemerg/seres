notes: Laboratory/pilot powder pellet press for die pressing catalyst powders,
  regolith cathode pellets, ceramic powders, and small powder-metallurgy green
  compacts. Includes a small hydraulic press frame, press cylinder/power unit,
  pressure/load indication, control panel, reusable pellet_press_die_set tooling,
  feed hopper, ejector/demolding tooling, and safety guarding. Current KB uses are
  low-throughput die pressing; no current reference requires a separate roller-die
  pellet_mill or briquetting_press. Use pelletizer_v0 only for polymer pelletizing
  and split future bulk pellet or briquette production to a dedicated machine.
