notes: BOM for the historical blast_furnace_or_smelter ID, now scoped as a compact
  shaft/cupola-style iron smelting and carbothermal reduction furnace. Components
  cover refractory lining, shell, forced-air blast, tuyeres, charging, tapping,
  cooling, and exhaust/offgas handling; they do not make the item a universal
  smelter for aluminum, copper, steel refining, induction remelting, or small
  crucible melts.
