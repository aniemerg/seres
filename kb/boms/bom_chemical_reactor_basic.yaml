notes: |
  Bill of materials for a basic stirred/jacketed chemical reactor.
  Stainless or ordinary steel construction for non-corrosive to moderately corrosive
  liquid-phase chemistry.
  Heated jacket, agitation, gas ports, relief valve, and temperature control are
  included; acid-lined, high-pressure, molten-salt, packed-bed, and refractory
  service require specific reactor resources.
