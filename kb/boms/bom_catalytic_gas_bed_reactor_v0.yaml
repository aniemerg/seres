    qty: 1
    notes: Pressure/containment shell for gas-phase reactor service.
  - item_id: catalyst_bed_assembly
    qty: 1
    notes: Replaceable catalyst bed, gauze, monolith, or packed contact bed.
  - item_id: heating_jacket_assembly
    qty: 1
