  - item_id: gas_outlet_manifold
    qty: 1
    notes: Product/offgas collection from catalyst bed.
  - item_id: pressure_relief_valve
    qty: 1
    notes: Overpressure protection.
  - item_id: temperature_controller_basic
    qty: 1
    notes: Reactor temperature control.
  - item_id: thermocouple_type_s_v0
    qty: 2
    notes: Bed inlet/outlet or bed-zone temperature sensing.
  - item_id: offgas_handling
    qty: 1
    notes: Interface to downstream scrubbing/condensation/offgas routing.
  - item_id: structural_frame_medium
    qty: 1
  - item_id: fastener_kit_medium
    qty: 1
notes: |
  Coarse BOM for a gas-solid catalytic bed reactor. Catalyst composition is
