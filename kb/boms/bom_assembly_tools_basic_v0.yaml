  - item_id: power_conditioning_module
    qty: 1
  - item_id: sensor_suite_general
    qty: 1
  - item_id: control_compute_module_imported
    qty: 1
notes: |
  BOM for a basic assembly workstation/tool bundle. tool_station_frame provides
  bench/station structure; tool_set_general provides shared hand tools, clamps,
  holders, and fixture aids; power_conditioning_module supports small powered
  drivers or test aids; sensor_suite_general and control_compute_module_imported
  support guided assembly or simple checks. Portable hand-tool kits remain separate
  process resources when a station is not needed.
