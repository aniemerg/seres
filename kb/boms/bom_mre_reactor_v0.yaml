notes: |
  Best-guess composition for an integrated MRE reactor. The BOM explicitly
  includes refractory vessel, installed electrode set, startup/trim heating,
  insulation, oxygen offgas manifold interface, cooling/heat-transport hardware,
  high-current bus, optical pyrometer, controls, sensors, and compute.

  Mass boundary excludes external regolith feed bins, oxygen storage/compression,
  downstream crude-metal refining, and spare/replacement electrode inventory.
  Product removal is represented at coarse scale by offgas manifold collection
  for oxygen bubbles and by reactor/tap handling assumptions for crude molten
  metal and residual slag/regolith.
