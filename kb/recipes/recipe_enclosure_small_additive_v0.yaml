id: recipe_enclosure_small_additive_v0
target_item_id: enclosure_small
variant_id: additive
inputs:
  - item_id: polymer_printing_feedstock
    qty: 3.7
    unit: kg
  - item_id: fastener_kit_small
    qty: 1.3
    unit: kg
outputs:
  - item_id: enclosure_small
    qty: 1.0
    unit: unit
steps:
  - process_id: additive_manufacturing_polymer_v0
    inputs:
      - item_id: polymer_printing_feedstock
        qty: 3.7
        unit: kg
    outputs:
      - item_id: polymer_printed_part
        qty: 3.7
        unit: kg
    est_time_hr: 4.0
    machine_hours: 4.0
    labor_hours: 0.5
    notes: "Print enclosure body and cover in polymer; include mounting bosses and cable openings."
  - process_id: support_removal_and_cleanup_v0
    est_time_hr: 0.5
    labor_hours: 0.5
    notes: "Remove supports, deburr openings, and clean up surfaces."
  - process_id: assembly_basic_v0
    inputs:
      - item_id: polymer_printed_part
        qty: 3.7
        unit: kg
      - item_id: fastener_kit_small
        qty: 1.3
        unit: kg
    outputs:
      - item_id: enclosure_small
        qty: 1.0
        unit: unit
    est_time_hr: 0.5
    labor_hours: 0.5
    notes: "Install hardware, gaskets, and terminals as needed."
assumptions: Uses polymer printer; suitable for benign small/medium electronics enclosures. Not suitable as a silent substitute for steel enclosures in high-heat, EMI-sensitive, fire-rated, vacuum/outgassing-sensitive, grounded, or high-impact contexts.
notes: Additive polymer path for small electronics enclosures; default only when polymer material properties are acceptable.
