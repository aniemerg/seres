assumptions: Heavy welded steel construction with electric-hydraulic drive system.
  Four hydraulic cylinders for boom/stick/bucket/swing. Lunar-adapted variant uses
  dust guards, thermal protection, sensors, imported embedded control compute, and
  sealed hydraulic components rather than an unmodified terrestrial mini-excavator.
notes: Excavator assembly using existing parts (tracks, boom, bucket, hydraulics,
  motors) and standard assembly/wiring processes. Scope is low-throughput surface
  regolith excavation; hard rock, polar ice, and subsurface sampling require specialized
  drilling or excavation resources.
