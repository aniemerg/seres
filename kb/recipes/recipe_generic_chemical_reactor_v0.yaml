id: recipe_generic_chemical_reactor_v0
kind: recipe
target_item_id: generic_chemical_reactor_v0
inputs:
  - item_id: steel_plate_or_sheet
    qty: 200.0
    unit: kg
  - item_id: machined_part_raw
    qty: 20.0
    unit: kg
  - item_id: control_panel_basic
    qty: 20.0
    unit: kg
  - item_id: electrical_wire_and_connectors
    qty: 10.0
    unit: kg
  - item_id: piping_assembly_small
    qty: 10.0
    unit: kg
steps:
  - process_id: welded_fabrication_basic_v0
    inputs:
      - item_id: steel_plate_or_sheet
        qty: 200.0
        unit: kg
    outputs:
      - item_id: welded_fabrications
        qty: 190.0
        unit: kg
      - item_id: metal_scrap
        qty: 10.0
        unit: kg
    notes: "Fabricate coarse steel reactor vessel and shell from steel plate (10 kg scrap)"
  - process_id: machining_finish_basic_v0
    inputs:
      - item_id: welded_fabrications
        qty: 190.0
        unit: kg
      - item_id: machined_part_raw
        qty: 20.0
        unit: kg
    outputs:
      - item_id: welded_fabrications
        qty: 210.0
        unit: kg
    notes: "Machine and install generic internal supports, baffles, and mounting points"
  - process_id: assembly_basic_v0
    inputs:
      - item_id: welded_fabrications
        qty: 210.0
        unit: kg
      - item_id: piping_assembly_small
        qty: 10.0
        unit: kg
    outputs:
      - item_id: assembled_equipment
        qty: 220.0
        unit: kg
    notes: "Install basic piping, valves, and mechanical fittings; specialized relief, corrosion lining, catalyst beds, and offgas systems are out of scope"
  - process_id: electrical_assembly_basic_v0
    inputs:
      - item_id: assembled_equipment
        qty: 220.0
        unit: kg
      - item_id: control_panel_basic
        qty: 20.0
        unit: kg
      - item_id: electrical_wire_and_connectors
        qty: 10.0
        unit: kg
    outputs:
      - item_id: assembled_equipment
        qty: 250.0
        unit: kg
    notes: "Install basic control panel, wire sensors and controls (total: 250 kg)"
  - process_id: integration_test_basic_v0
    inputs:
      - item_id: assembled_equipment
        qty: 250.0
        unit: kg
    outputs:
      - item_id: generic_chemical_reactor_v0
        qty: 1.0
        unit: unit
    notes: "Final testing and calibration"
notes: "Legacy coarse machine-assembly chain for generic_chemical_reactor_v0. Prefer chemical_reactor_basic for audited stirred/jacketed reactor requirements and specialized reactors for pressure, corrosion, packed-bed, molten-salt, or hazardous gas chemistry."
