id: recipe_drawing_die_set_basic_v0
target_item_id: drawing_die_set_basic
variant_id: v0
inputs:
  - item_id: machined_part_raw
    qty: 5.0
    unit: kg
steps:
  - process_id: machining_finish_basic_v0
    inputs:
      - item_id: machined_part_raw
        qty: 5.0
        unit: kg
    outputs:
      - item_id: machined_part_raw
        qty: 5.0
        unit: kg
    est_time_hr: 4.0
    machine_hours: 4.0
    notes: "Machine die bodies and holders from tool steel blanks"
  - process_id: heat_treat_basic_v0
    inputs:
      - item_id: machined_part_raw
        qty: 5.0
        unit: kg
    outputs:
      - item_id: machined_part_raw
        qty: 5.0
        unit: kg
    est_time_hr: 2.0
    machine_hours: 2.0
    notes: "Heat treat die bodies for hardness and wear resistance"
  - process_id: precision_grinding_basic_v0
    inputs:
      - item_id: machined_part_raw
        qty: 5.0
        unit: kg
    outputs:
      - item_id: finished_part_deburred
        qty: 5.0
        unit: kg
    est_time_hr: 3.0
    machine_hours: 3.0
    notes: "Grind, lap, and polish die apertures to precise bore geometry and smooth bearing surfaces for wire reduction"
  - process_id: inspection_basic_v0
    inputs:
      - item_id: finished_part_deburred
        qty: 5.0
        unit: kg
    outputs:
      - item_id: drawing_die_set_basic
        qty: 1.0
        unit: unit
    est_time_hr: 0.5
    labor_hours: 0.5
    notes: "Verify die aperture dimensions, entrance angle, bearing length, polish, and surface finish"
assumptions: Tool steel dies with precision-ground apertures. Multiple sizes for progressive
  wire reduction; harder alloys and refractory metals may need carbide, PCD, diamond,
  or refractory-compatible inserts. Reliable drawing also depends on lubricant,
  cooling where needed, and wear checks during use; those are process requirements,
  not capabilities supplied by the passive die set itself.
notes: Canonical basic reusable die set for reducing wire diameter through progressive
  drawing steps. Supersedes wire_drawing_die_set.
