id: recipe_controlled_heating_plate_v0
kind: recipe
name: Assemble controlled heating plate
target_item_id: controlled_heating_plate_v0
variant_id: v0
inputs:
  - item_id: heating_plate_base
    qty: 15.0
    unit: kg
  - item_id: induction_coil_or_heating_element
    qty: 3.0
    unit: kg
  - item_id: temperature_controller_basic
    qty: 1.0
    unit: unit
  - item_id: insulation_pack_high_temp
    qty: 1.0
    unit: unit
outputs:
  - item_id: controlled_heating_plate_v0
    qty: 1.0
    unit: unit
steps:
  - process_id: assembly_basic_v0
    inputs:
      - item_id: heating_plate_base
        qty: 15.0
        unit: kg
      - item_id: induction_coil_or_heating_element
        qty: 3.0
        unit: kg
      - item_id: temperature_controller_basic
        qty: 1.0
        unit: unit
      - item_id: insulation_pack_high_temp
        qty: 1.0
        unit: unit
    outputs:
      - item_id: controlled_heating_plate_v0
        qty: 1.0
        unit: unit
    notes: Assemble resistive heating element, insulated plate base, temperature controller,
      wiring, and safety interlocks.
assumptions: Temperature controller electronics fabricated or imported. Heating element
  is used in resistive mode; induction coil/yoke geometry is out of scope.
notes: Controlled resistive heating plate for small surfaces and fixtures.
