id: recipe_machine_solar_tracking_optional_v0
kind: recipe
target_item_id: solar_tracking_optional
variant_id: v0
inputs:
  - item_id: tracking_mount_structure
    qty: 70.0
    unit: kg
  - item_id: tracking_drive_assembly
    qty: 40.0
    unit: kg
  - item_id: tracking_control_unit
    qty: 8.0
    unit: kg
  - item_id: position_sensor_set
    qty: 0.5
    unit: kg
  - item_id: power_output_terminals
    qty: 2.0
    unit: kg
  - item_id: fastener_kit_medium
    qty: 1.0
    unit: kg
outputs:
  - item_id: solar_tracking_optional
    qty: 1.0
    unit: unit

steps:
  - process_id: welding_and_fabrication_v0
    inputs:
      - item_id: tracking_mount_structure
        qty: 70.0
        unit: kg
    outputs:
      - item_id: tracking_mount_structure
        qty: 70.0
        unit: kg
    est_time_hr: 6.0
    labor_hours: 6.0
    notes: "Fabricate and weld single-axis PV tracking frame structure and panel mounting points"
  - process_id: machining_finish_basic_v0
    inputs:
      - item_id: tracking_drive_assembly
        qty: 40.0
        unit: kg
    outputs:
      - item_id: tracking_drive_assembly
        qty: 40.0
        unit: kg
    est_time_hr: 4.0
    machine_hours: 4.0
    labor_hours: 2.0
    notes: "Machine pivot bearings, gear components, and motor mounts for tracking axes"
  - process_id: assembly_basic_v0
    inputs:
      - item_id: tracking_mount_structure
        qty: 70.0
        unit: kg
      - item_id: tracking_drive_assembly
        qty: 40.0
        unit: kg
      - item_id: fastener_kit_medium
        qty: 1.0
        unit: kg
    outputs:
      - item_id: assembled_equipment
        qty: 111.0
        unit: kg
    est_time_hr: 5.0
    labor_hours: 5.0
    notes: "Assemble drive motor or actuator, gearing, bearings, and pivot mechanism for single-axis PV tracking"
  - process_id: wiring_and_electronics_integration_v0
    inputs:
      - item_id: tracking_control_unit
        qty: 8.0
        unit: kg
      - item_id: position_sensor_set
        qty: 0.5
        unit: kg
      - item_id: power_output_terminals
        qty: 2.0
        unit: kg
    outputs:
      - item_id: assembled_electrical_equipment
        qty: 10.5
        unit: kg
    est_time_hr: 3.0
    labor_hours: 3.0
    notes: "Install position sensors, wire motor or actuator to control system, integrate sun-tracking and stow logic"
  - process_id: integration_test_basic_v0
    inputs:
      - item_id: assembled_equipment
        qty: 111.0
        unit: kg
      - item_id: assembled_electrical_equipment
        qty: 10.5
        unit: kg
    outputs:
      - item_id: assembled_equipment
        qty: 121.5
        unit: kg
    est_time_hr: 2.0
    labor_hours: 2.0
    notes: "Test single-axis tracking motion, verify position accuracy, calibrate sun-following and stow behavior"
  - process_id: inspection_basic_v0
    inputs:
      - item_id: assembled_equipment
        qty: 121.5
        unit: kg
    outputs:
      - item_id: solar_tracking_optional
        qty: 1.0
        unit: unit

    est_time_hr: 1.0
    labor_hours: 1.0
    notes: "Verify smooth tracking motion and structural integrity under load"
assumptions: "Optional small single-axis PV tracking system for improved power generation. Fixed-tilt PV remains valid when the tracker is omitted; concentrators and heliostats use separate dual-axis tracking resources."
notes: |
  Assumptions:
  - Masses aligned to component sum (121.5 kg) for assembly balance.
  Small single-axis PV tracker assembly. Provides optional sun tracking for a small
  solar array with structural mount, pivot/bearing interfaces, actuator/drive,
  controller, position sensors, stow behavior, and maintenance access. Total
  assembly time ~20-21 hours.
