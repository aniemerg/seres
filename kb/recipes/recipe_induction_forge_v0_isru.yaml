id: recipe_induction_forge_v0_isru
kind: recipe
name: Induction forge (compact ISRU-focused)
target_item_id: induction_forge_v0
variant_id: isru_v0
inputs:
- item_id: regolith_metal_crude
  qty: 55.0
  unit: kg
  notes: Locally refined metal for compact support frame, guards, and brackets.
- item_id: induction_coil_or_heating_element
  qty: 6.0
  unit: kg
  notes: Copper induction coil set.
- item_id: power_conditioning_module
  qty: 1.0
  unit: unit
  notes: High-current inverter or medium-frequency power stage.
- item_id: capacitor_bank_power
  qty: 10.0
  unit: kg
  notes: Resonant tank capacitor bank.
- item_id: cooling_loop_basic
  qty: 20.0
  unit: kg
  notes: Closed cooling loop for coil and electronics.
- item_id: temperature_controller_basic
  qty: 1.0
  unit: unit
- item_id: enclosure_electrical_medium
  qty: 1.0
  unit: unit
- item_id: control_compute_module_imported
  qty: 1.0
  unit: unit
- item_id: ground_clamp_and_cables
  qty: 4.0
  unit: kg
- item_id: interlock_switch_set
  qty: 0.5
  unit: kg
- item_id: safety_guard_steel_mesh
  qty: 1.0
  unit: kg
- item_id: thermal_insulation_basic
  qty: 2.0
  unit: kg
- item_id: fastener_kit_medium
  qty: 1.5
  unit: kg
outputs:
- item_id: induction_forge_v0
  qty: 1.0
  unit: unit
steps:
- process_id: metal_casting_basic_v0
  inputs:
  - item_id: regolith_metal_crude
    qty: 55.0
    unit: kg
  outputs:
  - item_id: cast_metal_parts
    qty: 50.0
    unit: kg
  - item_id: metal_scrap
    qty: 5.0
    unit: kg
  est_time_hr: 4.0
  machine_hours: 4.0
  notes: Cast or prepare compact frame, guards, and support brackets.
- process_id: machine_assembly_basic_v0
  inputs:
  - item_id: cast_metal_parts
    qty: 50.0
    unit: kg
  - item_id: induction_coil_or_heating_element
    qty: 6.0
    unit: kg
  - item_id: power_conditioning_module
    qty: 1.0
    unit: unit
  - item_id: capacitor_bank_power
    qty: 10.0
    unit: kg
  - item_id: cooling_loop_basic
    qty: 20.0
    unit: kg
  - item_id: temperature_controller_basic
    qty: 1.0
    unit: unit
  - item_id: enclosure_electrical_medium
    qty: 1.0
    unit: unit
  - item_id: control_compute_module_imported
    qty: 1.0
    unit: unit
  - item_id: ground_clamp_and_cables
    qty: 4.0
    unit: kg
  - item_id: interlock_switch_set
    qty: 0.5
    unit: kg
  - item_id: safety_guard_steel_mesh
    qty: 1.0
    unit: kg
  - item_id: thermal_insulation_basic
    qty: 2.0
    unit: kg
  - item_id: fastener_kit_medium
    qty: 1.5
    unit: kg
  outputs:
  - item_id: induction_forge_v0
    qty: 1.0
    unit: unit
  est_time_hr: 8.0
  labor_hours: 8.0
  notes: Assemble compact induction forge subsystems and perform coolant, insulation,
    interlock, and low-power functional checks.
assumptions: |
  Compact forge-shop unit for heating bars, billets, and bar ends before forging.
  Imported/control electronics are retained where the current KB has no local
  equivalent.
notes: |
  Rescaled from the former 1800 kg industrial line recipe to match the canonical
  125 kg compact induction forge item.
