id: recipe_machine_epoxy_synthesis_unit_v0
kind: recipe
target_item_id: epoxy_synthesis_unit
variant_id: v0
inputs:
  - item_id: bulk_material_or_parts
    qty: 200.0
    unit: kg
steps:
  - process_id: assembly_basic_v0
    inputs:
      - item_id: bulk_material_or_parts
        qty: 200.0
        unit: kg
    outputs:
      - item_id: epoxy_synthesis_unit
        qty: 1
        unit: unit
    est_time_hr: 4.0
    labor_hours: 4.0
notes: |
  Assumptions:
  - Placeholder assembly uses 200 kg bulk material to match epoxy_synthesis_unit mass.
  - Intended machine is a compact resin synthesis skid assembled from reactor vessel,
    agitator, jacketed heating/cooling, feed/vent piping, condenser or simple
    distillation/solvent recovery, wash/separation hardware, controls, pressure
    relief, and frame components.
  - Detailed componentized assembly should replace this scaffold when subsystem
    masses are reconciled for a 200 kg pilot-scale unit.
  Rationale:
  - Balances assembly mass while the BOM is refined away from feedstock placeholders.
