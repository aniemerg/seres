id: recipe_cement_mixer_small_v0
target_item_id: cement_mixer_small
variant_id: v0
inputs:
  - item_id: metal_feedstock
    qty: 134.5
    unit: kg
  - item_id: motor_electric_small
    qty: 12.0
    unit: kg
  - item_id: bearing_set_small
    qty: 0.3
    unit: kg
  - item_id: fastener_kit_medium
    qty: 1.0
    unit: kg
outputs:
  - item_id: cement_mixer_small
    qty: 1.0
    unit: unit
steps:
  - process_id: metal_casting_basic_v0
    inputs:
    - item_id: metal_feedstock
      qty: 134.5
      unit: kg
    outputs:
    - item_id: cast_metal_parts
      qty: 132.5
      unit: kg
    est_time_hr: 3.0
    machine_hours: 3.0
    notes: "Cast mixer drum, gear housing, motor mount"
  - process_id: machining_finish_basic_v0
    inputs:
    - item_id: cast_metal_parts
      qty: 132.5
      unit: kg
    outputs:
    - item_id: machined_part_raw
      qty: 131.5
      unit: kg
    est_time_hr: 4.0
    machine_hours: 4.0
    notes: "Machine drum rim, bearing surfaces, gear teeth, axle mounts"
  - process_id: welding_and_fabrication_v0
    inputs:
    - item_id: machined_part_raw
      qty: 131.5
      unit: kg
    outputs:
    - item_id: welded_fabrications
      qty: 131.2
      unit: kg
    est_time_hr: 2.0
    labor_hours: 2.0
    notes: "Weld frame structure, mixing drum supports, discharge chute"
  - process_id: assembly_basic_v0
    inputs:
    - item_id: welded_fabrications
      qty: 131.2
      unit: kg
    - item_id: motor_electric_small
      qty: 12.0
      unit: kg
    - item_id: bearing_set_small
      qty: 0.3
      unit: kg
    - item_id: fastener_kit_medium
      qty: 1.0
      unit: kg
    outputs:
    - item_id: cement_mixer_small
      qty: 1.0
      unit: unit
    est_time_hr: 2.0
    labor_hours: 2.0
    notes: "Assemble motor, gearbox, drum, frame, wheels"
assumptions: Electric motor (0.5-1 HP) for drum rotation. Drum capacity ~0.1-0.15 m³.
notes: |
  Assumptions:
  - Metal feedstock scaled to produce a ~131.2 kg welded frame/drum structure
    for a 144.5 kg portable 100-150 L drum mixer.
  Rationale:
  - Preserve discrete output units; intermediate fabricated mass remains approximate.
  - Aligns this older fabrication route with the scoped BOM recipe, which uses
    one small mixer motor rather than a duplicate medium drive train.
  Uncertainty:
  - Frame/drum mass split should be refined with detailed design.
