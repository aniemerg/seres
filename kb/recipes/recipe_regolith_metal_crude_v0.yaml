id: recipe_regolith_metal_crude_v0
kind: recipe
target_item_id: regolith_metal_crude
variant_id: v0
inputs:
  - item_id: regolith_lunar_mare
    qty: 100.0
    unit: kg
outputs:
  - item_id: regolith_metal_crude
    qty: 22.8
    unit: kg
  - item_id: oxygen_gas
    qty: 15.2
    unit: kg
  - item_id: regolith_fine_fraction
    qty: 40.0
    unit: kg
  - item_id: regolith_coarse_fraction
    qty: 20.0
    unit: kg
steps:
  - process_id: regolith_mining_simple_v0
    inputs: []
    outputs:
      - item_id: regolith_lunar_mare
        qty: 100.0
        unit: kg
    est_time_hr: 1.0
    machine_hours: 1.0
    notes: "Mine mare regolith from surface"
  - process_id: regolith_screening_sieving_v0
    inputs:
      - item_id: regolith_lunar_mare
        qty: 100.0
        unit: kg
    outputs:
      - item_id: regolith_coarse_fraction
        qty: 60.0
        unit: kg
      - item_id: regolith_fine_fraction
        qty: 40.0
        unit: kg
    est_time_hr: 0.5
    machine_hours: 0.5
    notes: "Screen and separate size fractions"
  - process_id: regolith_crushing_grinding_v0
    inputs:
      - item_id: regolith_coarse_fraction
        qty: 40.0
        unit: kg
    outputs:
      - item_id: regolith_powder
        qty: 38.0
        unit: kg
    est_time_hr: 1.5
    machine_hours: 1.5
    notes: "Crush and grind coarse regolith to powder"
  - process_id: oxygen_extraction_molten_regolith_electrolysis_v0
    inputs:
      - item_id: regolith_powder
        qty: 38.0
        unit: kg
    outputs:
      - item_id: oxygen_gas
        qty: 15.2
        unit: kg
      - item_id: regolith_metal_crude
        qty: 22.8
        unit: kg
    est_time_hr: 4.0
    machine_hours: 4.0
    notes: "Extract oxygen and produce metal byproduct via MRE; oxygen offgas collection, metal tapping, and slag/residue cleanout are represented at coarse process level."
assumptions: |
  Co-product mixed metal alloy from molten regolith electrolysis in
  mre_reactor_v0; refining not modeled.
notes: |
  Coarse MRE route; add refining/separation later. Crude metal is treated as a
  tapped/removed reactor product, while detailed slag/regolith residue handling
  and alloy separation are deferred to downstream process variants.
