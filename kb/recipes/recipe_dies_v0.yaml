id: recipe_dies_v0
target_item_id: dies
variant_id: v0
inputs:
  - item_id: regolith_metal_crude
    qty: 45.0
    unit: kg
outputs:
  - item_id: dies
    qty: 1.0
    unit: unit

  - item_id: steel_scrap_v0
    qty: 5.0
    unit: kg
steps:
  - process_id: mold_preparation_basic_v0
    est_time_hr: 0.5
    labor_hours: 0.5
  - process_id: metal_casting_basic_v0
    inputs:
      - item_id: regolith_metal_crude
        qty: 45.0
        unit: kg
    outputs:
      - item_id: cast_metal_parts
        qty: 42.5
        unit: kg
    est_time_hr: 1.0
    machine_hours: 1.0
  - process_id: machining_finish_basic_v0
    inputs:
      - item_id: cast_metal_parts
        qty: 42.5
        unit: kg
    outputs:
      - item_id: dies
        qty: 1.0
        unit: unit

      - item_id: steel_scrap_v0
        qty: 2.5
        unit: kg
    est_time_hr: 1.0
    machine_hours: 1.0
assumptions: Cast steel die blanks then machine for a basic hot-press die set; heat
  treatment, precision grinding/polishing, and high-temperature graphite/ceramic/refractory
  variants are deferred to more specific tooling items.
notes: Coarse route for the legacy `dies` item now scoped as hot_press_die_set_basic-style
  tooling used with hot_press_v0 and sintering/hot-pressing processes.
