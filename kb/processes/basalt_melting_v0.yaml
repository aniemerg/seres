id: basalt_melting_v0
kind: process
name: Basalt melting (basic)
process_type: batch
layer_tags:
- layer_5
inputs:
- item_id: basalt_aggregate
  qty: 1.0
  unit: kg
outputs:
- item_id: basalt_molten
  qty: 1.0
  unit: kg
resource_requirements:
- machine_id: labor_bot_general_v0
  qty: 1
  unit: count
- machine_id: glass_furnace_v0
  qty: 1
  unit: count
energy_model:
  type: fixed_per_batch
  value: 2.5
  unit: kWh
  notes: Melting 1 kg basalt batch to 1200-1400°C
time_model:
  type: batch
  hr_per_batch: 3.0
  notes: Heat-up and melt cycle
notes: Melts basalt aggregate for casting or fiberizing processes using
  glass_furnace_v0 as a compatible small-batch refractory-lined melter at
  approximately 1200-1400°C. Basalt melts can be refractory-corrosive; larger
  continuous operation or fiber production needs compatible refractory details and
  downstream fiber_drawing_tower or casting resources.
