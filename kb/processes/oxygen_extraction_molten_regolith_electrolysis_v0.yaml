id: oxygen_extraction_molten_regolith_electrolysis_v0
kind: process
name: Molten regolith electrolysis (oxygen extraction)
layer_tags:
- layer_3
- layer_4
inputs:
- item_id: regolith_powder
  qty: 1.0
  unit: kg
- item_id: electrical_energy
  qty: 10.0
  unit: kWh
outputs:
- item_id: oxygen_gas
  qty: 0.4
  unit: kg
- item_id: regolith_metal_crude
  qty: 0.6
  unit: kg
resource_requirements:
- machine_id: labor_bot_general_v0
  qty: 1
  unit: count
- machine_id: mre_reactor_v0
  qty: 1
  unit: count
- machine_id: high_temperature_power_supply_v0
  qty: 1
  unit: count
  notes: Controlled high-current DC rectifier duty for molten regolith electrolysis.
energy_model:
  type: fixed_per_batch
  value: 10.0
  unit: kWh
  notes: electrolysis at ~1600°C, per kg O2 (~13 kWh/kg O2 theoretical)
time_model:
  type: batch
  hr_per_batch: 3.0
  notes: batch MRE cycle with electrode maintenance
process_type: batch
notes: |
  Anchor for oxygen + metal co-production by molten regolith electrolysis. Uses
  mre_reactor_v0 rather than electrolysis_cell_unit_v0 or a generic chemical
  reactor; high_temperature_power_supply_v0 represents coarse industrial
  controlled high-current DC electrolysis supply rather than ordinary bench power.

  Heating/product assumptions: the reactor provides integrated molten-regolith
  containment, startup/trim heating, insulation, offgas collection interface, and
  electrode/feedthrough hardware; MRE-specific electrode assemblies are modeled
  as reactor BOM components or maintenance replacements rather than a separate
  machine requirement for this batch process. Oxygen evolves as bubbles and
  exits through the offgas manifold interface. Crude reduced metal is treated as
  a tapped/removed co-product, while slag/regolith residue cleanout and detailed
  metal separation are deferred to downstream refining or future higher-fidelity
  MRE variants.
