id: lead_screw_fabrication_v0
kind: process
name: Lead screw assembly fabrication
process_type: batch
inputs:
- item_id: steel_bar_stock
  qty: 8.0
  unit: unit
- item_id: cutting_fluid
  qty: 0.5
  unit: kg
  notes: Coolant/lubricant for precision thread cutting and finishing
outputs:
- item_id: lead_screw_assembly
  qty: 1.0
  unit: unit
resource_requirements:
- machine_id: precision_lathe
  qty: 1
  unit: count
- machine_id: grinder_cylindrical_v0
  qty: 1
  unit: count
  notes: Finish grinding/lapping proxy if screw accuracy exceeds lathe-only cutting
- machine_id: precision_tooling_set
  qty: 1
  unit: count
- machine_id: measurement_equipment
  qty: 1
  unit: count
  notes: Micrometers, indicators, gauge blocks, and setup metrology
- machine_id: labor_bot_general_v0
  qty: 1
  unit: count
energy_model:
  type: fixed_per_batch
  value: 0.6
  unit: kWh
  notes: Placeholder energy for machining lead screw assembly from stock (1 unit per
    batch).
time_model:
  type: batch
  hr_per_batch: 1.5
notes: Fabrication of a lead screw assembly from steel bar stock. Precision_lathe
  handles turning/threading; grinder_cylindrical_v0 and measurement_equipment are
  required when screw pitch, straightness, or runout needs higher accuracy than
  lathe-only cutting.
