id: sintering_basic_v0
kind: process
name: Basic sintering
layer_tags:
- layer_6
- layer_7
inputs:
- item_id: powder_metal_or_ceramic
  qty: 1.0
  unit: kg
outputs:
- item_id: sintered_parts
  qty: 0.95
  unit: kg
resource_requirements:
- machine_id: labor_bot_general_v0
  qty: 1
  unit: count
- machine_id: furnace_high_temp
  qty: 1
  unit: count
- machine_id: inert_atmosphere_system
  qty: 1
  unit: count
- machine_id: hydraulic_press
  qty: 1
  unit: count
- machine_id: pressing_mold_set
  qty: 1
  unit: count
  notes: Press tooling for green compact shape before furnace sintering.
energy_model:
  type: per_unit
  value: 4.0
  unit: kWh/kg
  scaling_basis: powder_metal_or_ceramic
  notes: High temperature heating below melting point, typically 800-1400°C depending
    on material
time_model:
  type: linear_rate
  rate: 0.333
  rate_unit: kg/hr
  scaling_basis: powder_metal_or_ceramic
  notes: Pressing, furnace heat-up, sintering hold time, controlled cooling
notes: Sintering process for consolidating powder materials (metal, ceramic) into
  solid parts by heating below melting point. Hydraulic_press provides green-compact
  pressing force, pressing_mold_set provides geometry/tooling, and furnace_high_temp
  performs the thermal sintering step. inert_atmosphere_system provides purge/oxygen
  exclusion for atmosphere-sensitive variants; a generic sealed chamber is not the
  sintering hot-zone resource.
process_type: continuous
is_template: true
