id: selective_solar_sintering_v0
kind: process
name: Selective solar sintering v0
process_type: continuous
inputs:
  - item_id: regolith_powder
    qty: 1.0
    unit: kg
outputs:
  - item_id: regolith_sinter_featured_part_v0
    qty: 0.92
    unit: kg
  - item_id: tailings
    qty: 0.08
    unit: kg
resource_requirements:
  - machine_id: labor_bot_general_v0
    qty: 1
    unit: count
  - machine_id: selective_solar_sinterer_v0
    qty: 1
    unit: count
energy_model:
  type: per_unit
  value: 0.18
  unit: kWh/kg
  scaling_basis: regolith_powder
  notes: Electrical auxiliaries only; primary thermal input from concentrated sunlight.
time_model:
  type: linear_rate
  rate: 4.5
  rate_unit: kg/hr
  scaling_basis: regolith_powder
  notes: Layerwise sinter throughput for first-generation machine configuration.
notes: >
  Selective concentrated-solar sintering of regolith powder into geometry-controlled
  structural parts.

