id: regolith_screening_sieving_v0
kind: process
name: Regolith screening and sieving
layer_tags:
- layer_1
inputs:
- item_id: regolith_lunar_mare
  qty: 1.0
  unit: kg
outputs:
- item_id: regolith_coarse_fraction
  qty: 0.6
  unit: kg
- item_id: regolith_fine_fraction
  qty: 0.4
  unit: kg
resource_requirements:
- machine_id: labor_bot_general_v0
  qty: 1
  unit: count
- machine_id: screening_equipment
  qty: 1
  unit: count
- machine_id: dust_collection_system
  qty: 1
  unit: count
energy_model:
  type: per_unit
  value: 0.05
  unit: kWh/kg
  scaling_basis: regolith_lunar_mare
  notes: vibrating screen motor power
time_model:
  type: linear_rate
  rate: 20.0
  rate_unit: kg/hr
  scaling_basis: regolith_lunar_mare
  notes: continuous screening ~20 kg/hr throughput
notes: Compact vibratory screening/sieving split of regolith into coarse and fine
  particle-size fractions at about 20 kg/hr for this pilot-scale model. This is
  size classification only; density separation belongs in gravity_separator or
  related concentration processes. Dust collection is required for enclosed lunar
  regolith handling. Uses screening_equipment as the canonical compact vibrating
  screen/sieve classifier; deprecated vibrating_screen_v0 is not required.
process_type: continuous
