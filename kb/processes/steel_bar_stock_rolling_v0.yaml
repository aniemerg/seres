id: steel_bar_stock_rolling_v0
kind: process
name: Steel bar stock rolling from ingot v0
layer_tags:
- layer_5
- layer_6
inputs:
- item_id: steel_ingot
  qty: 1.0
  unit: kg
outputs:
- item_id: steel_bar_stock
  qty: 0.75
  unit: kg
byproducts:
- item_id: slag
  qty: 0.25
  unit: kg
resource_requirements:
- machine_id: plate_rolling_mill
  qty: 1
  unit: count
- machine_id: furnace_basic
  qty: 1
  unit: count
energy_model:
  type: per_unit
  value: 0.6
  unit: kWh/kg
  scaling_basis: steel_ingot
  notes: Energy intensity for hot rolling and separate reheating per kilogram of
    input material
time_model:
  type: linear_rate
  rate: 0.5
  rate_unit: kg/hr
  scaling_basis: steel_ingot
notes: Placeholder hot steel bar stock rolling path; furnace_basic provides preheat
  or reheating and plate_rolling_mill provides mechanical reduction. Yields 0.75
  kg bar stock and 0.25 kg slag per 1 kg ingot.
process_type: continuous
