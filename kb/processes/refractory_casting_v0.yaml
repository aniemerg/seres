  qty: 1.0
  unit: kg
outputs:
- item_id: acid_resistant_reactor_lining_v0
  qty: 1.0
  unit: kg
resource_requirements:
- machine_id: labor_bot_general_v0
  qty: 1
  unit: count
- machine_id: refractory_installation_tools
  qty: 1
  unit: count
- machine_id: cement_mixer_small
  qty: 1
  unit: count
- machine_id: refractory_vibrator
  qty: 1
  unit: count
energy_model:
  type: per_unit
  value: 0.8
  unit: kWh/kg
  scaling_basis: refractory_castable
  notes: cement_mixer_small for castable mixing, refractory_vibrator for consolidation,
    and heating for initial cure
time_model:
  type: linear_rate
  rate: 0.4
  rate_unit: kg/hr
  scaling_basis: refractory_castable
