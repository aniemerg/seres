id: wire_arc_additive_process_v0
kind: process
name: Wire arc additive manufacturing process v0
process_type: batch
layer_tags:
- layer_5
inputs:
- item_id: metal_wire_feed
  qty: 1.0
  unit: kg
outputs:
- item_id: deposited_metal_structure
  qty: 0.95
  unit: kg
byproducts:
- item_id: slag
  qty: 0.05
  unit: kg
resource_requirements:
- machine_id: labor_bot_general_v0
  qty: 1
  unit: count
- machine_id: ebf3_3d_printer
  qty: 1
  unit: count
energy_model:
  type: fixed_per_batch
  value: 3.0
  unit: kWh
  notes: Arc welding energy for deposition (~1 kg batch)
time_model:
  type: batch
  hr_per_batch: 4.0
  notes: Layer-by-layer deposition time
notes: >
  Wire-feed metal additive manufacturing for large metal structures. This legacy
  WAAM placeholder is consolidated under the canonical EBF3 3D printer because
  the lunar self-replication literature selects Electron Beam Freeform
  Fabrication (EBF3) over laser-based metal printing and treats EBF3/EBAM as the
  primary metal additive route.
