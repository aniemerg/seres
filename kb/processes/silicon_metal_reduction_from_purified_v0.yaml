id: silicon_metal_reduction_from_purified_v0
kind: process
name: Silicon metal production from purified silicon v0
layer_tags:
- layer_4
inputs:
- item_id: silicon_purified
  qty: 1.0
  unit: kg
- item_id: crucible_ceramic_refractory
  qty: 0.05
  unit: kg
  notes: Consumable high-purity ceramic/quartz crucible placeholder for molten silicon
    contact; generic refractory crucible resource is insufficiently specific.
outputs:
- item_id: silicon_metal_v0
  qty: 1.0
  unit: kg
resource_requirements:
- machine_id: labor_bot_general_v0
  qty: 1
  unit: count
- machine_id: reduction_furnace_v0
  qty: 1
  unit: count
- machine_id: gas_handling_loop_v0
  qty: 1
  unit: count
energy_model:
  type: fixed_per_batch
  value: 3.0
  unit: kWh
  notes: Placeholder energy intensity for silicon metal production via purification
    reduction
time_model:
  type: batch
  hr_per_batch: 1.0
notes: |
  Reduction/final conditioning of purified silicon to silicon metal; placeholder
  for a Rochow-compatible path. Modeled as a small batch controlled-atmosphere
  furnace operation with consumed high-purity ceramic/quartz crucible containment
  and gas-loop atmosphere control, not as generic high-temperature heating.
process_type: batch
