id: powder_pressing_process_v0
name: Powder Pressing (Basic)
kind: process
inputs:
- item_id: powder_feedstock
  qty: 1.5
  unit: kg
outputs:
- item_id: green_ceramic_parts
  qty: 1.4
  unit: kg
byproducts:
- item_id: dust_fines_v0
  qty: 0.1
  unit: kg
resource_requirements:
- machine_id: pellet_press
  qty: 1
  unit: count
- machine_id: pellet_press_die_set
  qty: 1
  unit: count
energy_model:
  type: per_unit
  value: 0.6
  unit: kWh/kg
  scaling_basis: powder_feedstock
time_model:
  type: linear_rate
  rate: 15.0
  rate_unit: kg/hr
  scaling_basis: powder_feedstock
notes: Powder pressing step using pellet_press with cylindrical pellet die tooling;
  forms green parts from screened powder feedstock. Assumes die fill, compaction at
  controlled pressure, short dwell, ejection/demolding, and small-batch throughput
  rather than continuous roller-die pelletizing. Binder content, exact pellet or
  part diameter, and downstream drying/sintering/screening are recipe-specific and
  should be modeled in the recipe that consumes the green parts.
process_type: continuous
