id: mirror_polishing_v0
kind: process
name: Mirror polishing
layer_tags:
- layer_6
- layer_7
inputs:
- item_id: metal_sheet
  qty: 2.0
  unit: kg
outputs:
- item_id: parabolic_mirror_segment
  qty: 1.0
  unit: unit
resource_requirements:
- machine_id: labor_bot_general_v0
  qty: 1
  unit: count
- machine_id: surface_grinder
  qty: 1
  unit: count
- machine_id: polishing_station
  qty: 1
  unit: count
- machine_id: optical_metrology_tools
  qty: 1
  unit: count
energy_model:
  type: fixed_per_batch
  value: 3.0
  unit: kWh
  notes: Grinding and polishing operations for optical surface
time_model:
  type: batch
  hr_per_batch: 6.0
  notes: Progressive grinding and polishing to achieve optical surface finish and
    parabolic shape
process_type: batch
notes: >
  Mirror polishing process for solar concentrator segments. Uses surface_grinder
  for figure generation and polishing_station for the polishing/compound stage
  needed after grinding. Achieves 90% reflectivity for nickel, 75% for steel.
  Parabolic shape is verified with optical metrology. Alternative to Fresnel lenses
  for solar concentration. Used in thermionic power systems. See:
  design/solar_thermionics_report.md
