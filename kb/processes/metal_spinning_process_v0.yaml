id: metal_spinning_process_v0
kind: process
name: Metal spinning process v0
process_type: batch
layer_tags:
- layer_4
- layer_5
inputs:
- item_id: stainless_steel_sheet
  qty: 30.0
  unit: kg
outputs:
- item_id: tank_shell_spun
  qty: 28.0
  unit: kg
byproducts:
- item_id: spinning_scrap_metal_v0
  qty: 2.0
  unit: kg
resource_requirements:
- machine_id: metal_spinning_lathe_v0
  qty: 1
  unit: count
energy_model:
  type: fixed_per_batch
  value: 15.0
  unit: kWh
  notes: Spin-form sheet into shell; 0.5 kWh/kg * 30 kg per batch
time_model:
  type: batch
  hr_per_batch: 4.0
notes: Spin forming operation converting sheet metal into an axisymmetric tank shell
  using a metal-spinning lathe, mandrel, tailstock or pressure support, and forming
  rollers. Nominal 30 kg stainless shell is within the modeled scope. Larger recipe
  overrides, such as 150 kg cryogenic tank shells, require explicit diameter/thickness
  checks and may need a dedicated large CNC metal-spinning or flow-forming machine.
