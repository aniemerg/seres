id: powder_metallurgy_pressing_v0
kind: process
name: Powder Metallurgy Pressing (Basic)
layer_tags:
- layer_6
- layer_7
inputs:
- item_id: tungsten_powder
  qty: 0.2
  unit: kg
outputs:
- item_id: pressed_component
  qty: 0.18
  unit: kg
byproducts:
- item_id: dust_fines_v0
  qty: 0.02
  unit: kg
resource_requirements:
- machine_id: pellet_press
  qty: 1
  unit: count
- machine_id: pellet_press_die_set
  qty: 1
  unit: count
energy_model:
  type: per_unit
  value: 0.5
  unit: kWh/kg
  scaling_basis: tungsten_powder
time_model:
  type: linear_rate
  rate: 10.0
  rate_unit: kg/hr
  scaling_basis: tungsten_powder
notes: Powder metallurgy die pressing step to form a small green compact from
  screened tungsten powder. Assumes dedicated die tooling, controlled pressure,
  short dwell, ejection/demolding, and optional binder from upstream powder
  preparation. Output is an unsintered green compact; downstream sintering,
  heat treatment, sizing, or screening belongs in the recipe for the finished
  component.
process_type: continuous
