id: mixing_and_blending_v0
kind: process
process_type: batch
name: Mixing and blending
layer_tags:
- layer_5
- layer_6
inputs:
- item_id: component_material_a
  qty: 0.5
  unit: kg
- item_id: binder_simple
  qty: 0.5
  unit: kg
outputs:
- item_id: blended_mixture
  qty: 1.0
  unit: kg
resource_requirements:
- machine_id: labor_bot_general_v0
  qty: 1
  unit: count
- machine_id: mixer_or_blender
  qty: 1
  unit: count
energy_model:
  type: fixed_per_batch
  value: 0.3
  unit: kWh
  notes: Mixing cycle energy for 1 kg batch
time_model:
  type: batch
  hr_per_batch: 0.5
  notes: Loading, mixing, and unloading per batch
notes: 'Low-detail mixing and blending of multiple materials to create homogeneous
  mixtures where material behavior is not central to the model. Use powder_mixer
  for dry powder uniformity or powder-metallurgy feedstock, cement_mixer_small for
  concrete/mortar/refractory castables, mixing_station for formulation or potting
  workflow, chemical_mixer_tank for liquid/slurry chemical processing, and ball_mill_v0
  only when size reduction is required. Mixing time and energy vary by material viscosity
  and desired homogeneity. Minimal material loss.'
