id: pelletize_catalyst_powder_v0
kind: process
name: Pelletize catalyst powder
process_type: batch
inputs:
- item_id: catalyst_powder_v0
  qty: 1.0
  unit: kg
outputs:
- item_id: catalyst_pellet_forming_v0
  qty: 1.0
  unit: kg
resource_requirements:
- machine_id: labor_bot_general_v0
  qty: 1
  unit: count
- machine_id: pellet_press
  qty: 1
  unit: count
- machine_id: pellet_press_die_set
  qty: 1
  unit: count
energy_model:
  type: fixed_per_batch
  value: 0.15
  unit: kWh
time_model:
  type: batch
  hr_per_batch: 0.5
notes: Batch die pressing of catalyst powder into formed pellets using the
  laboratory/pilot pellet_press and a reusable pellet_press_die_set. Assumes
  pre-screened powder, optional low-percentage binder or moisture conditioning as
  required by the catalyst formulation, 3-10 mm nominal pellets, controlled press
  force with a short dwell, and ejection/demolding before handling. Output is a
  formed catalyst pellet intermediate; catalyst workflows may add drying,
  calcination, activation, or screening in the owning recipe when those operations
  are required.
