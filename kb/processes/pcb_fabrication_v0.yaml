notes: Printed circuit board fabrication process using the aggregate
  pcb_fab_equipment station. Includes photoresist application, UV exposure,
  developing, copper etching, rinse, drilling/routing, and simple surface finish.
  Produces a bare PCB ready for component assembly. Scope is simple single/double
  sided boards with coarse traces; plated through holes are not treated as a
  reliable production capability here, and soldermask, silkscreen, multilayer
  boards, fine-pitch HDI, and automated electrical test require advanced PCB
  fabrication resources or imports.
