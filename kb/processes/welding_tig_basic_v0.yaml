notes: 'TIG/GTAW-style welding process for precision joining in near vacuum.

  Requires welding_tig_unit_v0 as the torch/control add-on and welding_power_supply_v0
  as the separate arc power source.

  Used for stainless steel, aluminum, and critical high-quality welds.

  Produces clean, precise welds with minimal spatter.

  Slower than MIG but produces superior weld quality.

  Required for leak-tight joints in pressure vessels and cryogenic equipment.

  Near-vacuum operation does not assume air cooling, water cooling, or shielding
  hardware intended only to exclude oxygen atmosphere.

  '
