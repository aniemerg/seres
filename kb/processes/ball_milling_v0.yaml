id: ball_milling_v0
kind: process
name: Ball milling
process_type: batch
layer_tags:
- layer_5
- layer_6
inputs:
- item_id: coarse_powder
  qty: 1.0
  unit: kg
outputs:
- item_id: fine_powder
  qty: 0.98
  unit: kg
byproducts:
- item_id: dust_fines_v0
  qty: 0.02
  unit: kg
resource_requirements:
- machine_id: labor_bot_general_v0
  qty: 1
  unit: count
- machine_id: ball_mill_v0
  qty: 1
  unit: count
energy_model:
  type: fixed_per_batch
  value: 4.08
  unit: kWh
time_model:
  type: batch
  hr_per_batch: 8.0
notes: Ball milling process for particle-size reduction and powder homogenization;
  milling uses ball_mill_v0 with a separate grinding media charge from the machine
  BOM. Feed should already be coarse powder or pre-crushed material; use powder_mixer
  instead for blending-only steps with no size reduction. About 0.02 kg dust_fines
  is lost per kg input.
