id: heat_treatment_basic_v0
kind: process
process_type: batch
name: Heat treatment (basic)
layer_tags:
- layer_5
inputs:
- item_id: rough_part
  qty: 10.0
  unit: kg
outputs:
- item_id: finished_part
  qty: 10.0
  unit: kg
resource_requirements:
- machine_id: labor_bot_general_v0
  qty: 1
  unit: count
- machine_id: heat_treatment_furnace_v0
  qty: 1
  unit: count
- machine_id: quench_tank
  qty: 1
  unit: count
energy_model:
  type: fixed_per_batch
  value: 25.0
  unit: kWh
  notes: heating to austenitizing temperature (~850°C for steel) plus hold time and
    quench/tempering cycles (10 kg batch)
time_model:
  type: batch
  hr_per_batch: 3.0
  notes: heat-up, soak time, quench, temper cycle; batch process
notes: |
  Heat treatment of metals for hardening, tempering, annealing, or stress relief.
  Includes controlled heating, soaking, and cooling cycles.

  Template-level quenching assumption: quench_tank represents a small controlled
  tank with maintained water, oil, or polymer bath inventory. This generic
  template does not consume quenchant per batch. Concrete hardening variants
  should add explicit water/oil/polymer/salt inputs, contamination/waste outputs,
  replenishment rates, and fire or ventilation assumptions when medium-specific
  accounting matters.
is_template: true
