id: metal_fabrication_welding_v0
kind: process
name: Metal fabrication welding (v0)
layer_tags:
- layer_6
- layer_7
inputs:
- item_id: sheet_metal_or_structural_steel
  qty: 10.0
  unit: kg
- item_id: welding_rod_steel
  qty: 0.2
  unit: kg
outputs:
- item_id: welded_fabrications
  qty: 9.5
  unit: kg
resource_requirements:
- machine_id: labor_bot_general_v0
  qty: 1
  unit: count
- machine_id: welding_power_supply_v0
  qty: 1
  unit: count
- machine_id: metal_cutting_bandsaw
  qty: 1
  unit: count
- machine_id: sheet_metal_shear
  qty: 1
  unit: count
- machine_id: press_brake
  qty: 1
  unit: count
- machine_id: press_brake_die_set
  qty: 1
  unit: count
- machine_id: fixturing_workbench
  qty: 1
  unit: count
energy_model:
  type: per_unit
  value: 1.0
  unit: kWh/kg
  scaling_basis: sheet_metal_or_structural_steel
  notes: Welding and basic fabrication energy for metal welds
time_model:
  type: linear_rate
  rate: 20.0
  rate_unit: kg/hr
  scaling_basis: sheet_metal_or_structural_steel
notes: 'Metal fabrication welding: combines cutting, straight-bend forming with
  press-brake tooling, and welding of sheet/structural steel for fabrications.
  metal_cutting_bandsaw handles tube/section cutoff and sheet_metal_shear handles
  sheet/panel blanks. Steel welding rod is the default consumable input; override
  it for non-steel alloys or process-specific filler.'
process_type: continuous
