id: tube_bending_process_v0
name: Tube bending
kind: process
inputs:
- item_id: aluminum_tube_stock
  qty: 3.0
  unit: kg
outputs:
- item_id: pipe_bent_sections
  qty: 2.8
  unit: kg
byproducts:
- item_id: metal_scrap
  qty: 0.2
  unit: kg
resource_requirements:
- machine_id: tube_bender
  qty: 1
  unit: count
energy_model:
  type: per_unit
  value: 0.3
  unit: kWh/kg
  scaling_basis: aluminum_tube_stock
  notes: Tube bender power per kg input
time_model:
  type: linear_rate
  rate: 4.0
  rate_unit: kg/hr
  scaling_basis: aluminum_tube_stock
  notes: 'Bending rate: 4 kg/hr throughput'
notes: Bend aluminum tube stock into required bent pipe sections using tube_bender
  with appropriate bend die/follower tooling. Assumes moderate bend radius and wall
  thickness; tight-radius or thin-wall work may require mandrel/CNC variants.
  0.2 kg becomes trimming/setup scrap.
process_type: continuous
