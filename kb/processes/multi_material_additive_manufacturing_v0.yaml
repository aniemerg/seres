id: multi_material_additive_manufacturing_v0
kind: process
name: Multi-material additive manufacturing v0
process_type: continuous
inputs:
  - item_id: metal_wire_feed
    qty: 0.6
    unit: kg
  - item_id: regolith_powder
    qty: 0.4
    unit: kg
outputs:
  - item_id: multi_material_fabricated_part_v0
    qty: 0.9
    unit: kg
  - item_id: tailings
    qty: 0.1
    unit: kg
resource_requirements:
  - machine_id: labor_bot_general_v0
    qty: 1
    unit: count
  - machine_id: resource_3d_printer_multi_material_v0
    qty: 1
    unit: count
energy_model:
  type: per_unit
  value: 1.4
  unit: kWh/kg
  scaling_basis: metal_wire_feed
time_model:
  type: linear_rate
  rate: 1.6
  rate_unit: kg/hr
  scaling_basis: metal_wire_feed
notes: >
  Modular multi-material additive process combining wire and regolith-derived
  deposition paths.

