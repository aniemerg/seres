id: glass_envelope_quartz_fabrication_v0
name: Glass envelope quartz fabrication v0
kind: process
process_type: batch
inputs:
- item_id: fused_silica_glass
  qty: 1.0
  unit: kg
outputs:
- item_id: vacuum_envelope_quartz
  qty: 1.0
  unit: unit
requires_ids: []
resource_requirements:
- machine_id: glass_furnace_v0
  qty: 1
  unit: count
- machine_id: glassworking_station
  qty: 1
  unit: count
  notes: Quartz envelope forming/tooling downstream of melting or reheating.
- machine_id: annealing_oven_small
  qty: 1
  unit: count
  notes: Controlled cooling/annealing of the formed quartz envelope.
energy_model:
  type: fixed_per_batch
  value: 2.0
  unit: kWh
time_model:
  type: batch
  hr_per_batch: 0.5
notes: Fabrication of vacuum envelope quartz from fused silica glass; uses
  glass_furnace_v0 only as the small-batch melt/reheat resource, with
  glassworking_station for envelope forming and annealing_oven_small for controlled
  cooling. Fused-silica/quartz compatibility depends on refractory and element
  temperature ratings.
