id: surface_finishing_v0
kind: process
process_type: batch
name: Surface finishing
layer_tags:
- layer_6
- layer_7
inputs: []
outputs: []
resource_requirements:
- machine_id: labor_bot_general_v0
  qty: 1
  unit: count
- machine_id: surface_grinder
  qty: 1
  unit: count
- machine_id: polishing_station
  qty: 1
  unit: count
energy_model:
  type: fixed_per_batch
  value: 1.0
  unit: kWh
time_model:
  type: batch
  hr_per_batch: 2.0
notes: >
  Surface finishing operations to achieve desired surface quality, roughness, and
  appearance. Uses surface_grinder for flat grinding and polishing_station for
  polishing/buffing/lapping-style finishing. Removes machining marks, improves
  surface roughness, and achieves dimensional tolerances. Geometry-specific round
  grinding should use cylindrical_grinding_precision_v0 or
  bearing_grinding_precision_v0.
