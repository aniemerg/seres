id: pyroxene_separation_v0
kind: process
name: Pyroxene separation v0
layer_tags:
- layer_3
inputs:
- item_id: regolith_powder
  qty: 100.0
  unit: kg
outputs:
- item_id: pyroxene_concentrate
  qty: 25.0
  unit: kg
- item_id: tailings_silicate_mix
  qty: 75.0
  unit: kg
resource_requirements:
- machine_id: labor_bot_general_v0
  qty: 1
  unit: count
- machine_id: screening_equipment
  qty: 1
  unit: count
- machine_id: magnetic_separator_drum_v0
  qty: 1
  unit: count
energy_model:
  type: per_unit
  value: 0.5
  unit: kWh/kg
  scaling_basis: regolith_powder
  notes: Energy per kg feed; coarse estimate based on olivine_beneficiation_v0
time_model:
  type: linear_rate
  rate: 100.0
  rate_unit: kg/hr
  scaling_basis: regolith_powder
notes: Separation of pyroxene from other minerals using canonical
  screening_equipment for particle-size preparation plus magnetic/physical
  separation; yields pyroxene concentrate and tailings. Deprecated
  vibrating_screen_v0 is not required.
process_type: continuous
