id: stainless_refining_basic_v0
kind: process
name: Basic stainless refining and casting
layer_tags:
- layer_4
- layer_5
process_type: batch
inputs:
- item_id: stainless_steel_ingot
  qty: 1.05
  unit: kg
outputs:
- item_id: stainless_billet_or_slab
  qty: 1.0
  unit: kg
- item_id: slag
  qty: 0.05
  unit: kg
resource_requirements:
- machine_id: labor_bot_general_v0
  qty: 1
  unit: count
- machine_id: high_temperature_power_supply_v0
  qty: 1
  unit: count
  notes: Furnace/electrode power-controller duty for refining heat, not DC bench supply.
- machine_id: refining_furnace_v0
  qty: 1
  unit: count
- machine_id: ingot_mold_set
  qty: 1
  unit: count
energy_model:
  type: fixed_per_batch
  value: 2.0
  unit: kWh
  notes: Electric melting/refining and holding energy for stainless conversion; placeholder.
time_model:
  type: batch
  hr_per_batch: 2.0
  notes: Melt, refine, and cast billet/slab; batch cycle includes heat-up and tap.
notes: |
  Refines stainless steel ingot into stainless billet or slab using simple stock
  molds; adaptable to ISRU feedstocks. Uses refining_furnace_v0 for
  melting/refining; reduction_furnace_v0 is intentionally not required for this
  non-oxide-reduction route.
