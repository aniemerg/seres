id: grinding_and_finishing_v0
kind: process
name: Grinding and finishing
layer_tags:
- layer_6
- layer_7
process_type: batch
inputs:
- item_id: rough_part
  qty: 1.0
  unit: kg
outputs:
- item_id: finished_part
  qty: 1.0
  unit: kg
resource_requirements:
- machine_id: labor_bot_general_v0
  qty: 1
  unit: count
- machine_id: surface_grinder
  qty: 1
  unit: count
- machine_id: grinding_wheels
  qty: 1
  unit: count
- machine_id: work_rest_adjustable
  qty: 1
  unit: count
energy_model:
  type: fixed_per_batch
  value: 1.5
  unit: kWh
time_model:
  type: batch
  hr_per_batch: 2.5
notes: Combined flat grinding and final finishing operations for precision parts.
  Uses surface_grinder for flat faces and generic vitrified alumina/glass
  grinding_wheels where suitable. Round shafts, rollers, bores, bearing races, and
  balls should use cylindrical_grinding_precision_v0 or
  bearing_grinding_precision_v0. Specialized diamond, cBN, silicon-carbide, or
  cutoff wheels require a separate explicit wheel variant.
