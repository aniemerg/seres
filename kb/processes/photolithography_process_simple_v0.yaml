notes: Simple PCB-scale photolithography step using UV exposure of photoresist
  through a mask, development/rinse, and copper etching to reveal coarse copper
  traces. This is suitable for PCB traces and photolithographic copper coils, not
  semiconductor wafer or solar-cell cleanroom photolithography. Fine-pitch,
  multilayer, soldermask, silkscreen, and automated electrical-test capabilities
  are outside this station scope. pcb_fab_equipment bundles the develop/rinse
  station for coarse capacity modeling; model pcb_development_station separately
  only if wet-process capacity becomes a bottleneck.
