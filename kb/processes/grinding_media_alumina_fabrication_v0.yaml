id: grinding_media_alumina_fabrication_v0
kind: process
name: Grinding media alumina fabrication v0
process_type: batch
inputs:
  - item_id: alumina_ceramic_v0
    qty: 10.0
    unit: kg
outputs:
  - item_id: grinding_media_alumina_v0
    qty: 9.5
    unit: kg
  - item_id: tailings
    qty: 0.5
    unit: kg
resource_requirements:
  - machine_id: labor_bot_general_v0
    qty: 1
    unit: count
  - machine_id: furnace_high_temp
    qty: 1
    unit: count
energy_model:
  type: fixed_per_batch
  value: 4.2
  unit: kWh
time_model:
  type: batch
  hr_per_batch: 2.0
notes: >
  Batch forming and high-temperature firing/sintering of alumina grinding media stock
  using furnace_high_temp; no dedicated sintering furnace is required at this abstraction
  level unless atmosphere, contamination, or cycle-control constraints are added.
