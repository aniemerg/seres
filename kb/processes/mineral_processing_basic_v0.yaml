id: mineral_processing_basic_v0
kind: process
process_type: batch
name: Mineral processing (basic)
layer_tags:
- layer_4
- layer_5
inputs:
- item_id: regolith_lunar_mare
  qty: 1.0
  unit: kg
outputs:
- item_id: concentrated_mineral
  qty: 0.3
  unit: kg
- item_id: tailings
  qty: 0.7
  unit: kg
resource_requirements:
- machine_id: labor_bot_general_v0
  qty: 1
  unit: count
- machine_id: rock_crusher_basic
  qty: 1
  unit: count
- machine_id: screening_equipment
  qty: 1
  unit: count
- machine_id: gravity_separator
  qty: 1
  unit: count
- machine_id: dust_collection_system
  qty: 1
  unit: count
energy_model:
  type: fixed_per_batch
  value: 3.0
  unit: kWh
time_model:
  type: batch
  hr_per_batch: 2.0
notes: >
  Basic mineral processing to concentrate valuable minerals from ore or regolith.
  Includes crushing, screening, dry air-table density separation, and magnetic
  separation. Screening controls particle size before the density stage; the
  gravity separator is not a replacement for sieving/classification. Typical
  recovery ~30-50% depending on ore grade, density contrast, and particle-size
  distribution. Lunar operation assumes enclosed gas handling and dust collection
  for dry-table separation in vacuum.
