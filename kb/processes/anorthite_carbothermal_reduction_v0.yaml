notes: |
  Carbothermal reduction of anorthite feldspar to extract multiple valuable
  products.
  Source: FFC-process-for-deep-ISRU.txt, Sustainable-ISRU-on-the-Moon.txt
  Reaction: CaAl2Si2O8 + 4C -> 4CO + CaO + Al2O3 + 2Si
  Temperature: 1650-1860 C for 3 hours
  Process: High-temperature carbon reduction in furnace.
  Anorthite is primary mineral in lunar highland regolith (70-95% anorthosite).
  Products require separation after powdering:
  - CaO (quicklime): refractory, cement, thermionic coatings, Pidgeon Mg process.
  - Al2O3 (alumina): FFC feedstock for Al metal, refractory ceramics, catalyst.
  - Si (silicon): alloying element, semiconductor feedstock.
  - CO (carbon monoxide): recycled for Mond process or Boudouard reaction.
  Separation methods include mechanical grinding/milling, density separation,
  magnetic separation, and chemical leaching.
  Carbon monoxide can be recycled: C + CO2 -> 2CO (Boudouard).
  Stoichiometry: CaAl2Si2O8 (278.2 g) + 4C (48 g) -> CaO (56.1 g) +
  Al2O3 (102 g) + 2Si (56.2 g) + 4CO (112 g).
  Mass fractions from ore: 20.1% CaO, 36.7% Al2O3, 20.2% Si, 40.2% CO.
  Advantages: single process yields multiple valuable outputs.
  Disadvantages: very high temperature, carbon feedstock, and product separation
  complexity.
  Resource route: solar/high-temperature carbothermal route using
  furnace_high_temp, carbon_feeder_screw, offgas_handling, and solar
  concentration. This is not modeled as reduction_furnace_v0 because it is an
  extreme-temperature solar carbothermal receiver route rather than compact
  controlled-atmosphere batch reduction.
