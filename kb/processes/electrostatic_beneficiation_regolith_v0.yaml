id: electrostatic_beneficiation_regolith_v0
kind: process
name: Electrostatic beneficiation of regolith v0
process_type: continuous
inputs:
  - item_id: regolith_powder
    qty: 1.0
    unit: kg
outputs:
  - item_id: anorthite_ore
    qty: 0.45
    unit: kg
  - item_id: pyroxene_concentrate
    qty: 0.20
    unit: kg
  - item_id: ilmenite_concentrate
    qty: 0.12
    unit: kg
  - item_id: electrostatic_middlings_v0
    qty: 0.10
    unit: kg
  - item_id: tailings
    qty: 0.13
    unit: kg
resource_requirements:
  - machine_id: labor_bot_general_v0
    qty: 1
    unit: count
  - machine_id: screening_equipment
    qty: 1
    unit: count
  - machine_id: magnetic_separator_drum_v0
    qty: 1
    unit: count
  - machine_id: vibratory_feeder_v0
    qty: 1
    unit: count
  - machine_id: electrostatic_separator_v0
    qty: 1
    unit: count
energy_model:
  type: per_unit
  value: 0.24
  unit: kWh/kg
  scaling_basis: regolith_powder
  notes: Feed conditioning, magnetic pre-clean, and electrostatic separator auxiliaries.
time_model:
  type: linear_rate
  rate: 15.0
  rate_unit: kg/hr
  scaling_basis: regolith_powder
  notes: First-generation conservative throughput for dry tribocharging plate separation.
notes: >
  Dry beneficiation process combining feed sizing, optional magnetic pre-clean, and
  tribocharging + parallel-plate electrostatic separation into concentrate streams.

