id: metal_forging_process_v0
kind: process
name: Metal forging process v0
layer_tags:
- layer_4
- layer_5
process_type: batch
inputs:
- item_id: steel_bar_stock
  qty: 1.5
  unit: kg
outputs:
- item_id: bearing_ring_blanks
  qty: 1.3
  unit: kg
byproducts:
- item_id: slag
  qty: 0.2
  unit: kg
resource_requirements:
- machine_id: induction_forge_v0
  qty: 1
  unit: count
- machine_id: forging_press_v0
  qty: 1
  unit: count
- machine_id: anvil_or_die_set
  qty: 1
  unit: count
energy_model:
  type: fixed_per_batch
  value: 0.8
  unit: kWh
  notes: Induction heating plus compact forging press operation for a small batch
time_model:
  type: batch
  hr_per_batch: 0.75
notes: Controlled hot press-forging of bearing ring blanks from steel bar stock.
  Requires a separate induction forge or equivalent heat source to bring stock to
  forging temperature, a dedicated compact forging press for sustained ram force,
  and reusable anvil/die tooling for the geometry. Use power_hammer_or_press for
  impact forging and hydraulic_press for general cold pressing.
