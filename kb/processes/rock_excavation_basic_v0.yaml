id: rock_excavation_basic_v0
kind: process
name: Rock excavation (basic)
layer_tags:
- layer_2
inputs: []
outputs:
- item_id: basalt_aggregate
  qty: 1.0
  unit: kg
resource_requirements:
- machine_id: labor_bot_general_v0
  qty: 1
  unit: count
- machine_id: excavator_basic
  qty: 1
  unit: count
energy_model:
  type: per_unit
  value: 0.15
  unit: kWh/kg
  scaling_basis: basalt_aggregate
  notes: Excavator energy per kg of rock
time_model:
  type: linear_rate
  rate: 50.0
  rate_unit: kg/hr
  scaling_basis: basalt_aggregate
  notes: Excavation and handling time per kg for loose or fractured material at compact-equipment scale
notes: Basic low-throughput excavation and recovery of loose or fractured basalt/regolith
  for processing. This is not an intact hard-rock ripping, drilling, or polar ice
  mining process; use drilling_equipment_v0 or another specialized resource for
  those cases. Use loader_small when the task is primarily scooping and short-haul
  loading rather than boom-and-bucket digging.
process_type: continuous
