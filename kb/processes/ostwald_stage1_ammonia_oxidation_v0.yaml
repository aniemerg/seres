id: ostwald_stage1_ammonia_oxidation_v0
kind: process
name: Ostwald stage 1 ammonia oxidation
process_type: batch
layer_tags:
- layer_4
- layer_5
inputs:
- item_id: ammonia_gas
  qty: 1.0
  unit: kg
- item_id: oxygen_gas
  qty: 2.35
  unit: kg
outputs:
- item_id: nitric_oxide_gas
  qty: 1.76
  unit: kg
- item_id: water
  qty: 1.59
  unit: kg
resource_requirements:
- machine_id: gas_handling_loop_v0
  qty: 1
  unit: count
- machine_id: catalytic_gas_bed_reactor_v0
  qty: 1
  unit: count
- machine_id: labor_bot_general_v0
  qty: 1
  unit: count
energy_model:
  type: fixed_per_batch
  value: 3.0
  unit: kWh
  notes: Catalytic NH3 oxidation stage.
time_model:
  type: batch
  hr_per_batch: 2.0
  notes: High-temperature oxidation residence time.
notes: |
  Explicit representation of reaction 44:
  4NH3 + 5O2 -> 4NO + 6H2O.
  Catalyst pellet or gauze preparation is upstream tooling work, not a runtime
  pellet_press requirement.
  Uses gas_handling_loop_v0 for gas feed/recirculation and
  catalytic_gas_bed_reactor_v0 for the heated Pt/Rh gauze or catalyst-bed reactor
  service; the basic stirred/jacketed reactor is not assumed suitable.
