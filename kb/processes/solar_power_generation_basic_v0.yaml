id: solar_power_generation_basic_v0
kind: process
name: Basic solar power generation
layer_tags:
- layer_8
inputs:
- item_id: solar_irradiance
  qty: 1.0
  unit: kWh
outputs:
- item_id: electrical_energy
  qty: 1.0
  unit: kWh
energy_model:
  type: per_unit
  value: 0.0
  unit: kWh/kWh
  scaling_basis: solar_irradiance
  notes: Placeholder energy per unit of electrical energy output; rate to be calibrated
time_model:
  type: linear_rate
  rate: 1.0
  rate_unit: kWh/hr
  scaling_basis: solar_irradiance
  notes: Daily generation window; placeholder for lunar day cycle
notes: >
  Treats PV as imported initially; introduces power accounting node. Uses
  inverter_dc_to_ac_v0 for explicit DC-to-AC conversion from the solar array.
  Broader power_conditioning_equipment remains available for generic facility
  regulation and commissioning where the exact topology is not modeled.
  solar_tracking_optional is an optional small single-axis PV tracker for yield
  improvement; fixed-tilt array variants should omit that resource rather than
  treating tracking as mandatory hardware.
process_type: continuous
resource_requirements:
- machine_id: labor_bot_general_v0
  qty: 1
  unit: count
- machine_id: solar_array_v0
  qty: 1
  unit: count
- machine_id: inverter_dc_to_ac_v0
  qty: 1
  unit: count
- machine_id: power_distribution_bus
  qty: 1
  unit: count
- machine_id: solar_tracking_optional
  qty: 1
  unit: count
