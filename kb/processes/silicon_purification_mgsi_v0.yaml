id: silicon_purification_mgsi_v0
kind: process
name: Silicon purification (MgSi reduction) v0
layer_tags:
- layer_4
process_type: batch
inputs:
- item_id: magnesium_silicide
  qty: 100.0
  unit: kg
- item_id: crucible_ceramic_refractory
  qty: 5.0
  unit: kg
  notes: Consumable ceramic/quartz crucible placeholder; silicon purification should
    not rely on a generic refractory crucible machine resource.
outputs:
- item_id: silicon_purified
  qty: 50.0
  unit: kg
- item_id: magnesium_oxide
  qty: 50.0
  unit: kg
resource_requirements:
- machine_id: labor_bot_general_v0
  qty: 1
  unit: count
- machine_id: reduction_furnace_v0
  qty: 1
  unit: count
- machine_id: gas_handling_loop_v0
  qty: 1
  unit: count
energy_model:
  type: fixed_per_batch
  value: 800.0
  unit: kWh
  notes: Thermal energy for MgSi reduction/oxidation cycle (8 kWh/kg over 100 kg batch).
time_model:
  type: batch
  hr_per_batch: 4.0
  notes: Heat, reduction, and cool-down per batch.
notes: |
  Purify silicon via magnesium silicide reduction/oxidation path; yields purified
  silicon and magnesium oxide for recycle. Uses reduction_furnace_v0 as a batch
  controlled-atmosphere reduction furnace with consumed ceramic/quartz crucible
  containment and gas-loop atmosphere management.
