id: electrical_steel_production_v0
kind: process
name: Electrical steel production v0
layer_tags:
- layer_4
- layer_5
process_type: batch
inputs:
- item_id: iron_metal_pure
  qty: 0.96
  unit: kg
- item_id: silicon_metal_v0
  qty: 0.04
  unit: kg
outputs:
- item_id: electrical_steel_sheet
  qty: 1.0
  unit: kg
resource_requirements:
- machine_id: labor_bot_general_v0
  qty: 1.0
  unit: count
- machine_id: induction_furnace_v0
  qty: 1
  unit: count
- machine_id: plate_rolling_mill
  qty: 1
  unit: count
- machine_id: heat_treatment_furnace_v0
  qty: 1
  unit: count
- machine_id: surface_treatment_station
  qty: 1
  unit: count
- machine_id: coating_station
  qty: 1
  unit: count
- machine_id: labor_bot_general_v0
  qty: 1
  unit: count
energy_model:
  type: fixed_per_batch
  value: 5.0
  unit: kWh
time_model:
  type: batch
  hr_per_batch: 6.0
notes: Alloy iron with silicon, hot roll and cold roll to sheet gauge using
  plate_rolling_mill as the canonical flat rolling resource. heat_treatment_furnace_v0
  covers annealing/stress-relief cycles, surface_treatment_station covers cleaning
  or descaling/pickling preparation, and coating_station covers simplified
  insulation-coating application. This v0 model does not yet require a dedicated
  4-high precision cold rolling mill; add one only if later gauge-control
  requirements exceed the generic light-industrial plate_rolling_mill scope.
  Silicon improves magnetic properties and reduces core loss. Silicon can be
  extracted from silica in regolith.
