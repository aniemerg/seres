id: liquation_fe_tio2_separation_v0
kind: process
name: Liquation Fe/TiO2 separation v0
process_type: batch
inputs:
  - item_id: reduced_ilmenite_residue_v0
    qty: 10.0
    unit: kg
outputs:
  - item_id: iron_metal_pure
    qty: 3.4
    unit: kg
  - item_id: titanium_oxide
    qty: 5.1
    unit: kg
  - item_id: tailings
    qty: 1.5
    unit: kg
resource_requirements:
  - machine_id: labor_bot_general_v0
    qty: 1
    unit: count
  - machine_id: furnace_high_temp
    qty: 1
    unit: count
  - machine_id: magnetic_separator_drum_v0
    qty: 1
    unit: count
  - machine_id: centrifugal_separator_v0
    qty: 1
    unit: count
  - machine_id: gravity_separator
    qty: 1
    unit: count
energy_model:
  type: fixed_per_batch
  value: 9.0
  unit: kWh
  notes: Thermal conditioning plus multi-stage physical separation.
time_model:
  type: batch
  hr_per_batch: 2.6
  notes: Thermal soak, liberation pass, magnetic split, and cleanup stages.
notes: >
  Post-reduction liquation-separation route for Fe/TiO2 phase split from reduced
  ilmenite residue using thermal conditioning and staged physical separation.

