notes: Combined sheet metal fabrication and welding process for creating structural
  assemblies, tanks, frames, and enclosures, including straight press-brake bends
  with separate bend tooling. metal_cutting_bandsaw handles tube/section cutoff
  and sheet_metal_shear handles sheet/panel blanks. Steel welding rod is the
  default consumable for steel fabrication; use recipe overrides for aluminum,
  stainless, TIG, MIG, or brazing-specific filler.
