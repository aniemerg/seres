id: tungsten_sintering_high_temp_v0
kind: process
name: Tungsten sintering (high temperature)
layer_tags:
- layer_6
- layer_7
inputs:
- item_id: tungsten_powder
  qty: 1.0
  unit: kg
outputs:
- item_id: sintered_tungsten_part
  qty: 0.95
  unit: kg
resource_requirements:
- machine_id: labor_bot_general_v0
  qty: 1
  unit: count
- machine_id: furnace_high_temp
  qty: 1
  unit: count
- machine_id: inert_atmosphere_system
  qty: 1
  unit: count
energy_model:
  type: fixed_per_batch
  value: 50.0
  unit: kWh
time_model:
  type: batch
  hr_per_batch: 8.0
process_type: batch
notes: High-temperature sintering of tungsten powder at 2700-3000°C under inert atmosphere
  (argon or vacuum), using furnace_high_temp plus inert_atmosphere_system. Produces
  dense, high-strength tungsten components. Critical for thermionic cathode production.
  5% mass loss typical due to densification and gas evolution. Requires refractory-lined
  furnace capability at extreme temperatures; add vacuum/clean-hot-zone resources
  separately if needed. Slow heating/cooling rates prevent cracking.
