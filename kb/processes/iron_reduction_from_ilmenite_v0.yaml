id: iron_reduction_from_ilmenite_v0
kind: process
process_type: batch
name: Iron reduction from ilmenite concentrate
layer_tags:
- layer_4
- layer_5
inputs:
- item_id: ilmenite_concentrate
  qty: 10.0
  unit: kg
- item_id: hydrogen_gas
  qty: 1.0
  unit: kg
outputs:
- item_id: iron_product
  qty: 5.0
  unit: kg
- item_id: titanium_oxide
  qty: 4.0
  unit: kg
- item_id: water
  qty: 2.0
  unit: kg
resource_requirements:
- machine_id: labor_bot_general_v0
  qty: 1
  unit: count
- machine_id: reduction_furnace_v0
  qty: 1
  unit: count
- machine_id: gas_handling_loop_v0
  qty: 1
  unit: count
energy_model:
  type: fixed_per_batch
  value: 12.0
  unit: kWh
  notes: hydrogen reduction at ~1200°C; placeholder 12 kWh per batch (needs qty values
    to calculate properly)
time_model:
  type: batch
  hr_per_batch: 3.0
  notes: batch reduction cycle with gas recirculation
notes: |
  Hydrogen reduction route for ilmenite-derived feed:
  FeTiO3 + H2 -> Fe + TiO2 + H2O.
  This explicit pathway outputs water (not oxygen) for reaction-level consistency
  with the reaction inclusion plan.
